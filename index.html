<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MK1 Tracker">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="color-scheme" content="dark light">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>MK1 Workout Tracker</title>
<style>
:root{
  /* iOS-style system colours. Dark is the default; light mode below.
     --accent  = MK1 orange for text, icons and links (readable on the background)
     --accent2 = MK1 orange for filled buttons and badges (white text on top) */
  color-scheme: dark light;
  --paper:#000000; --card:#1C1C1E; --chip:#2C2C2E; --elev:#2C2C2E; --seg-on:#636366; --switch-off:#39393D;
  --text:#FFFFFF; --mute:rgba(235,235,245,.62); --placeholder:rgba(235,235,245,.38);
  --line:rgba(84,84,88,.65); --bar-bg:rgba(22,22,24,.86);
  --accent:#FF8A5B; --accent2:#E2502A; --accent-tint:rgba(226,80,42,.16);
  --good:#30D158; --good-tint:rgba(48,209,88,.16);
  --warn:#FF9F0A; --warn-tint:rgba(255,159,10,.16);
  --bad:#FF453A; --bad-tint:rgba(255,69,58,.15);
  --purple:#BF5AF2; --purple-tint:rgba(191,90,242,.16);
  --heat0:#2C2C2E; --heat-outline:#3A3A3C;
  --shadow:rgba(0,0,0,.55);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: light){
  :root{
    --paper:#F2F2F7; --card:#FFFFFF; --chip:#E9E9EE; --elev:#FFFFFF; --seg-on:#FFFFFF; --switch-off:#E2E2E7;
    --text:#000000; --mute:rgba(60,60,67,.78); --placeholder:rgba(60,60,67,.45);
    --line:rgba(60,60,67,.22); --bar-bg:rgba(249,249,251,.88);
    --accent:#C2410C; --accent2:#E2502A; --accent-tint:rgba(226,80,42,.12);
    --good:#1E7B34; --good-tint:rgba(52,199,89,.16);
    --warn:#A35300; --warn-tint:rgba(255,149,0,.16);
    --bad:#C3000F; --bad-tint:rgba(255,59,48,.12);
    --purple:#8434B5; --purple-tint:rgba(175,82,222,.14);
    --heat0:#E5E5EA; --heat-outline:#D1D1D6;
    --shadow:rgba(0,0,0,.18);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:var(--paper);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding-top:var(--safe-top);padding-bottom:var(--safe-bot)}
#app{max-width:500px;margin:0 auto;padding:14px 14px 100px}

.sync-chip{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 8px);transform:translate(-50%,-140%);
  background:var(--elev);border:1.5px solid var(--warn);color:var(--warn);border-radius:999px;padding:7px 14px;font-size:12px;font-weight:700;
  z-index:9999;transition:transform .25s ease;pointer-events:none;white-space:nowrap}
.sync-chip.show{transform:translate(-50%,0)}
.sync-chip.done{background:var(--elev);border-color:var(--good);color:var(--good)}
.sync-banner{background:var(--bad-tint);border:1.5px solid var(--bad);color:var(--bad);border-radius:14px;
  padding:12px 14px;font-size:12.5px;line-height:1.5;margin-bottom:14px;
  display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.sync-banner-dismiss{background:none;border:none;color:var(--bad);font-size:18px;cursor:pointer;
  padding:0;line-height:1;flex-shrink:0;opacity:.7}

.page-header{padding:6px 0 4px}
.kicker{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
.page-header h1{font-size:26px;font-weight:800;letter-spacing:-.03em;margin-top:2px}
.page-header p{color:var(--mute);font-size:13px;margin-top:4px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.scard{background:var(--card);border:1.5px solid var(--line);border-radius:16px;
  padding:16px 14px;cursor:pointer;transition:transform .08s;position:relative;overflow:hidden}
.scard:active{transform:scale(.97)}
.scard::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent);opacity:0;transition:opacity .2s}
.scard.has-data::before{opacity:1}
.scard h2{font-size:16px;font-weight:800;letter-spacing:-.01em}
.scard .focus{color:var(--mute);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-top:3px}
.scard .last{color:var(--mute);font-size:12px;margin-top:12px;line-height:1.4}
.scard .last b{color:var(--text)}

.histbtn{margin-top:12px;width:100%;background:none;border:1.5px dashed var(--line);
  color:var(--mute);border-radius:14px;padding:13px;font-size:14px;font-weight:700;cursor:pointer}

.topbar{display:flex;align-items:center;gap:10px;padding:6px 0 12px}
.back{background:var(--chip);border:none;color:var(--text);border-radius:11px;
  padding:9px 14px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0}
.topbar-info{flex:1;min-width:0}
.topbar-info h2{font-size:19px;font-weight:800;letter-spacing:-.02em}
.topbar-info .focus{color:var(--accent);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em}
.timer-chip{flex-shrink:0;background:var(--chip);border:1.5px solid var(--line);border-radius:11px;
  padding:7px 12px;text-align:center;line-height:1.1}
.timer-chip .tlabel{color:var(--mute);font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.timer-chip .tval{color:var(--accent);font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:1px}

.ex{background:var(--card);border:1.5px solid var(--line);border-radius:16px;
  padding:14px;margin-bottom:10px;transition:border-color .2s}
.ex.done{border-color:var(--good)}
.ex-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:2px}
.ex-name{font-weight:700;font-size:15px;line-height:1.3}
/* Exercise number: drag it to reorder exercises */
.ex-num{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 6px;margin-right:8px;
  border-radius:8px;background:var(--chip);border:1.5px solid var(--line);color:var(--mute);font-size:12px;font-weight:800;vertical-align:1px}
.ex-drag{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:grab}
/* While dragging, every card shrinks to its header so it's a short list */
#app.ex-reordering .ex > :not(.ex-head),
#app.ex-reordering .ss-card > :not(.ss-header){display:none}
#app.ex-reordering .ex-head{margin-bottom:0}
#app.ex-reordering .ss-header{margin-bottom:0}
#app.ex-reordering .ex, #app.ex-reordering .ss-card{transition:transform .12s ease}
.ex.ex-dragging, .ss-card.ex-dragging{position:relative;z-index:6;transition:none !important;
  filter:drop-shadow(0 8px 18px var(--shadow));cursor:grabbing}
.ex-dragging .ex-num, .ex-dragging .ss-badge{background:var(--accent2);border-color:var(--accent);color:#fff}
.ex-note{color:var(--mute);font-size:12px;font-style:italic;margin-top:2px;line-height:1.4}
.scheme{color:var(--accent);font-weight:800;font-size:13px;white-space:nowrap;flex-shrink:0}
.prev{color:var(--mute);font-size:12px;margin:5px 0 10px;line-height:1.4}
.prev b{color:var(--text)}

.sets{display:flex;flex-direction:column;gap:7px}
.setrow{display:grid;grid-template-columns:24px 1fr 1fr 42px 26px;gap:6px;align-items:center}
.setn{color:var(--mute);font-size:12px;font-weight:800;text-align:center;cursor:pointer;
  width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  background:var(--chip);border:1.5px solid var(--line);position:relative;user-select:none;
  -webkit-user-select:none;transition:border-color .15s;flex-shrink:0}
/* Drag a set by its number to reorder it (touch and mouse) */
.setn{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.setrow.set-dragging{position:relative;z-index:5;transition:none;filter:drop-shadow(0 6px 14px var(--shadow))}
.setrow.set-dragging .setn{background:var(--accent2);border-color:var(--accent);color:#fff}
.setrow.set-settling{transition:transform .15s ease}
.sets.sets-reordering .setrow:not(.set-dragging){transition:transform .12s ease}
.setn[data-type="warmup"]{background:var(--warn-tint);border-color:var(--warn);color:var(--warn)}
.setn[data-type="dropset"]{background:var(--purple-tint);border-color:var(--purple);color:var(--purple)}
.setn[data-type="failure"]{background:var(--bad-tint);border-color:var(--bad);color:var(--bad)}
.set-type-popup{position:absolute;left:0;top:34px;z-index:200;
  background:var(--elev);border:1.5px solid var(--line);border-radius:12px;
  padding:4px;box-shadow:0 8px 24px var(--shadow);min-width:148px}
.set-type-popup button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;
  color:var(--text);padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;text-align:left}
.set-type-popup button:active{background:var(--chip)}
.stp-badge{width:22px;height:22px;border-radius:6px;font-size:11px;font-weight:900;
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stp-normal{background:var(--chip);color:var(--mute);border:1px solid var(--line)}
.stp-warmup{background:var(--warn-tint);color:var(--warn);border:1px solid var(--warn)}
.stp-dropset{background:var(--purple-tint);color:var(--purple);border:1px solid var(--purple)}
.stp-failure{background:var(--bad-tint);color:var(--bad);border:1px solid var(--bad)}
/* Inline set-type badge used in history/reports */
.set-type-tag{display:inline-block;font-size:9px;font-weight:900;padding:1px 4px;
  border-radius:4px;vertical-align:middle;margin-right:2px}
.set-type-tag.warmup{background:var(--warn-tint);color:var(--warn);border:1px solid var(--warn)}
.set-type-tag.dropset{background:var(--purple-tint);color:var(--purple);border:1px solid var(--purple)}
.set-type-tag.failure{background:var(--bad-tint);color:var(--bad);border:1px solid var(--bad)}
.field{position:relative}
.setrow input{width:100%;background:var(--chip);border:1.5px solid var(--line);color:var(--text);
  border-radius:10px;padding:10px 6px;font-size:17px;font-weight:700;text-align:center;
  -webkit-appearance:none;appearance:none}
.setrow input:focus{outline:none;border-color:var(--accent)}
.setrow input::placeholder{color:var(--placeholder);font-weight:600}
.trend-ind{position:absolute;top:-6px;right:-5px;width:15px;height:15px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:900;
  background:var(--chip);border:1.5px solid var(--line);color:var(--mute);opacity:0;
  transition:opacity .15s;pointer-events:none}
.trend-ind.up,.trend-ind.down,.trend-ind.same{opacity:1}
.trend-ind.up{background:var(--good);border-color:var(--good);color:#fff}
.trend-ind.down{background:var(--accent2);border-color:var(--accent2);color:#fff}
.trend-ind.same{background:var(--chip);border-color:var(--mute);color:var(--mute)}
.tick{background:var(--chip);border:1.5px solid var(--line);color:var(--mute);
  border-radius:10px;height:44px;font-size:18px;cursor:pointer;width:100%}
.tick.on{background:var(--good);border-color:var(--good);color:#fff}
.remove-set{background:none;border:none;color:var(--mute);font-size:18px;cursor:pointer;height:44px;width:100%}
.remove-set:active{color:var(--bad)}
.addset-btn{background:none;border:none;color:var(--mute);font-size:12px;font-weight:700;
  padding:8px 0 2px;cursor:pointer;letter-spacing:.04em}

/* ── Superset card ─────────────────────────────────────── */
.ss-card{background:var(--card);border:1.5px solid var(--accent2);border-radius:16px;
  padding:14px;margin-bottom:10px;transition:border-color .2s}
.ss-card.done{border-color:var(--good)}
.ss-badge{background:var(--accent2);color:#fff;font-size:9px;font-weight:900;letter-spacing:.1em;
  padding:3px 7px;border-radius:20px;flex-shrink:0}
.ss-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ss-names{flex:1;min-width:0}
.ss-ex-label{display:flex;align-items:baseline;gap:6px;line-height:1.5}
.ss-ex-letter{color:var(--accent2);font-size:10px;font-weight:900;flex-shrink:0;width:12px}
.ss-ex-name{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ss-scheme{color:var(--mute);font-size:11px;font-weight:700;flex-shrink:0;margin-left:4px}
.ss-sets-label{color:var(--mute);font-size:12px;font-weight:700;white-space:nowrap;flex-shrink:0}
.ss-set-pair{display:grid;grid-template-columns:24px 1fr;gap:6px;margin-bottom:8px;align-items:start}
.ss-set-pair:last-of-type{margin-bottom:0}
.ss-set-n{color:var(--mute);font-size:12px;font-weight:800;text-align:center;padding-top:11px}
.ss-set-rows{display:flex;flex-direction:column;gap:5px}
.ss-row{display:grid;grid-template-columns:12px 1fr 1fr 42px;gap:5px;align-items:center}
.ss-row-letter{color:var(--accent2);font-size:9px;font-weight:900;text-align:center}
.ss-row input{width:100%;background:var(--chip);border:1.5px solid var(--line);color:var(--text);
  border-radius:10px;padding:8px 5px;font-size:15px;font-weight:700;text-align:center;
  -webkit-appearance:none;appearance:none}
.ss-row input:focus{outline:none;border-color:var(--accent2)}
.ss-row .tick{border-radius:10px;height:36px;font-size:16px;background:var(--chip);
  border:1.5px solid var(--line);color:var(--mute);cursor:pointer;width:100%}
.ss-row .tick.on{background:var(--good);border-color:var(--good);color:#fff}
/* Builder superset card */
.ss-draft{background:var(--card);border:1.5px solid var(--accent2);border-radius:12px;
  padding:10px 12px;margin-bottom:10px}
.ss-draft-header{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.ss-draft-ex{display:flex;align-items:center;gap:6px;margin-bottom:7px}
.ss-draft-ex:last-of-type{margin-bottom:0}
.ss-draft-ex-letter{color:var(--accent2);font-size:10px;font-weight:900;width:12px;flex-shrink:0}
.ss-draft-ex-name{flex:1;font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ss-draft-sets-row{display:flex;align-items:center;gap:6px;margin-top:8px}
.ss-draft-sets-label{font-size:11px;color:var(--mute);font-weight:700}
.ss-add-btn{background:var(--accent2);border:none;color:#fff;border-radius:10px;
  padding:0 14px;font-weight:800;font-size:13px;cursor:pointer;height:36px}

.savebar{position:fixed;bottom:0;left:0;right:0;
  background:linear-gradient(transparent,var(--paper) 30%);padding:16px 14px calc(16px + var(--safe-bot));pointer-events:none}
.savebar .inner{max-width:500px;margin:0 auto;pointer-events:all}
.save-btn{width:100%;background:var(--accent2);border:none;color:#fff;border-radius:16px;
  padding:17px;font-size:17px;font-weight:800;cursor:pointer}
.save-btn:disabled{opacity:.4}

/* ── Session lifecycle (Phase 2) ─────────────────────────── */
.start-session-btn{background:var(--good);border:none;color:#fff;border-radius:12px;
  padding:10px 18px;font-size:14px;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:6px}
.draft-badge{display:inline-block;background:var(--accent2);color:#fff;font-size:10px;font-weight:800;
  padding:4px 9px;border-radius:20px;margin-bottom:8px}
.add-mid-session-btn{width:100%;background:none;border:1.5px dashed var(--line);color:var(--mute);
  border-radius:14px;padding:13px;font-size:13px;font-weight:700;cursor:pointer;margin:4px 0 16px}
.ex-swap-btn{background:var(--chip);border:1.5px solid var(--line);color:var(--mute);
  border-radius:8px;width:30px;height:30px;font-size:15px;cursor:pointer;flex-shrink:0}

.exit-prompt-card{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.exit-prompt-title{font-size:14px;color:var(--mute);font-weight:700;margin-bottom:4px;text-align:center}
.exit-prompt-btn{display:flex;flex-direction:column;align-items:flex-start;gap:3px;
  background:var(--card);border:1.5px solid var(--line);color:var(--text);
  border-radius:14px;padding:14px 16px;font-size:15px;font-weight:800;cursor:pointer;text-align:left}
.exit-prompt-btn.primary{border-color:var(--good);background:var(--good-tint)}
.exit-prompt-btn.danger{border-color:var(--bad);color:var(--bad)}
.exit-prompt-sub{font-size:11.5px;font-weight:600;color:var(--mute)}
.exit-prompt-btn.danger .exit-prompt-sub{color:var(--bad)}

.template-change-card{margin-top:16px}

.blank-session-btn{width:100%;background:none;border:1.5px dashed var(--accent2);color:var(--accent2);
  border-radius:14px;padding:13px;font-size:13.5px;font-weight:800;cursor:pointer;margin:10px 0 4px}

.app-update-banner{position:fixed;left:14px;right:14px;bottom:calc(14px + var(--safe-bot));
  z-index:500;background:var(--accent2);color:#fff;border-radius:14px;padding:13px 14px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  font-size:13px;font-weight:700;box-shadow:0 8px 24px var(--shadow)}
.app-update-banner button{background:#fff;color:var(--accent2);border:none;border-radius:10px;
  padding:8px 14px;font-size:12.5px;font-weight:800;cursor:pointer;flex-shrink:0}

.toast{position:fixed;top:calc(16px + var(--safe-top));left:50%;transform:translateX(-50%);
  background:var(--good);color:#fff;padding:11px 20px;border-radius:99px;
  font-weight:700;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99;white-space:nowrap}
.toast.show{opacity:1}

.hday{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.hday-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.hday-head b{font-size:15px;font-weight:800}
.hday-head span{color:var(--mute);font-size:12px}
.hday-head .dur{color:var(--accent);font-weight:700}
.hrow{display:flex;justify-content:space-between;gap:10px;font-size:13px;
  padding:6px 0;border-top:1px solid var(--line);align-items:baseline}
.hrow .hn{color:var(--mute);flex:1}
.hrow .hv{font-weight:700;text-align:right;white-space:nowrap;color:var(--text)}
.del-btn{background:none;border:none;color:var(--bad);font-size:12px;font-weight:700;cursor:pointer;padding:8px 0 0}

.empty{color:var(--mute);text-align:center;padding:50px 20px;font-size:14px;line-height:1.7}
.empty strong{color:var(--text);display:block;font-size:16px;margin-bottom:8px}
.section-label{color:var(--mute);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.14em;
  margin:20px 0 10px;display:flex;align-items:center;justify-content:space-between}
.icon-btn{background:var(--chip);border:1.5px solid var(--line);color:var(--text);border-radius:9px;
  width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:13px;
  cursor:pointer;flex-shrink:0}
.icon-btn:active{border-color:var(--accent)}
.label-actions{display:flex;gap:6px}
.loading{color:var(--mute);text-align:center;padding:60px 20px;font-size:14px}
.last-updated{text-align:center;color:var(--mute);font-size:12px;margin:6px 0 18px;line-height:1.6}
.last-updated b{color:var(--text)}

.photo-upload-row{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.photo-preview{width:72px;height:72px;border-radius:50%;background:var(--accent2);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;flex-shrink:0;
  background-size:cover;background-position:center}
.photo-upload-actions{display:flex;flex-direction:column;gap:8px;flex:1}
.photo-upload-btn{background:var(--chip);border:1.5px solid var(--line);color:var(--text);
  border-radius:10px;padding:10px 14px;font-size:13px;font-weight:700;cursor:pointer;text-align:center}
.photo-remove-btn{background:none;border:none;color:var(--bad);font-size:12px;font-weight:700;

.hiit-recent-name{font-size:13px;font-weight:700}

  padding:14px;cursor:pointer;position:relative;overflow:hidden;transition:transform .08s}

.hiit-ex-row{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);

.hiit-ex-row .hx-name{flex:1;font-size:13.5px;font-weight:700}
.hiit-ex-row.active{border-color:var(--accent);background:var(--chip)}

.hiit-timer-card.work{border-color:var(--accent)}
.hiit-timer-card.amrap{border-color:var(--accent)}
.hiit-phase{font-size:13px;font-weight:800;letter-spacing:.1em;color:var(--mute);text-transform:uppercase}

.hiit-controls{display:flex;gap:10px;margin-bottom:18px}
.hiit-ctrl-btn{flex:1;background:var(--chip);border:1.5px solid var(--line);color:var(--text);
  border-radius:14px;padding:14px;font-size:14px;font-weight:800;cursor:pointer}
.hiit-ctrl-btn.primary{background:var(--accent2);border-color:var(--accent2);color:#fff}
.round-rest-row{display:flex;align-items:center;justify-content:space-between;background:var(--chip);

.round-rest-row .rr-label{font-size:13px;font-weight:700}

.round-rest-sec{margin-top:8px}
.round-rest-sec input{width:100%;background:var(--chip);border:1.5px solid var(--line);color:var(--text);

  -webkit-appearance:none;appearance:none}

/* ═════════ iOS design layer (2026-10-20) ═════════
   Sits last so it wins over the older styles above. Colours come from the
   tokens at the top, so dark and light mode both follow the phone. */
html,body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;font-size:17px;line-height:1.3}
#app{padding:6px 16px 110px}
body.has-tabbar #app{padding-bottom:calc(120px + var(--safe-bot))}
button,input,select,textarea{font-family:inherit}

/* Large-title header (top-level screens) */
.page-header{padding:12px 0 6px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.kicker{color:var(--mute);font-size:13px;font-weight:600;letter-spacing:.02em;text-transform:uppercase}
.page-header h1{font-size:34px;line-height:41px;font-weight:700;letter-spacing:.01em;margin-top:2px}
.avatar-btn{width:40px;height:40px;border-radius:50%;border:none;padding:0;background:var(--chip);color:var(--text);
  overflow:hidden;flex-shrink:0;cursor:pointer}
.avatar-in{width:40px;height:40px;border-radius:50%;background:var(--accent2) center/cover no-repeat;color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600}

/* Navigation header (every other screen): Back, then a large title */
.topbar{display:grid;grid-template-columns:1fr auto;grid-template-areas:"back right" "info info";
  align-items:center;gap:0 8px;padding:2px 0 14px}
.topbar .back{grid-area:back;justify-self:start;background:none;border:none;border-radius:0;color:var(--accent);
  font-size:17px;font-weight:400;padding:0 6px 0 0;min-height:44px;display:inline-flex;align-items:center;gap:5px;margin-left:-2px}
.topbar-info{grid-area:info}
.topbar-info h2{font-size:28px;line-height:34px;font-weight:700;letter-spacing:.01em}
.topbar-info .focus{color:var(--mute);font-size:15px;font-weight:400;text-transform:none;letter-spacing:0;margin-top:2px}
.topbar > :not(.back):not(.topbar-info){grid-area:right;justify-self:end}
.timer-chip{border:none;border-radius:12px;background:var(--chip)}
.timer-chip .tval{color:var(--text)}

/* Section headings */
.section-label{color:var(--text);font-size:22px;line-height:28px;font-weight:700;letter-spacing:0;text-transform:none;
  margin:26px 2px 8px;display:flex;align-items:center;justify-content:space-between}
.icon-btn{border:none;background:var(--chip);color:var(--accent);border-radius:16px;min-width:32px;height:32px;
  display:inline-flex;align-items:center;justify-content:center}

/* Cards: borderless, 12pt corners */
.scard,.ex,.ss-card,.hday,.stat-card,.chart-card,.hiit-card,.exit-prompt-card,.weightbtn,.streakbtn,.settingsbtn,.trainerbtn,
.musclemapbtn,.dashboardbtn,.exmetricsbtn,.measurebtn,.leaderbtn{border:none;border-radius:12px}
.scard::before{display:none}
.scard h2{font-size:17px;font-weight:600}
.scard .focus{font-size:13px;font-weight:400;text-transform:none;letter-spacing:0}
.scard .last{font-size:13px}
.ex.done,.ss-card.done{box-shadow:inset 0 0 0 2px var(--good)}
.ss-card{box-shadow:inset 0 0 0 1.5px var(--accent2)}
.ex-name{font-size:17px;font-weight:600}
.scheme{color:var(--mute);font-weight:400;font-size:15px}
.prev{font-size:13px}

/* Grouped lists: consecutive rows join into one rounded block */
.sess-row,.ios-row,.lbrank-row{border:none;border-radius:0;margin:0;min-height:44px;position:relative;background:var(--card)}
.sess-row{padding:11px 16px}
.sess-row:not(.sess-row + .sess-row),.ios-row:not(.ios-row + .ios-row),.lbrank-row:not(.lbrank-row + .lbrank-row){border-top-left-radius:12px;border-top-right-radius:12px}
.sess-row:not(:has(+ .sess-row)),.ios-row:not(:has(+ .ios-row)),.lbrank-row:not(:has(+ .lbrank-row)){border-bottom-left-radius:12px;border-bottom-right-radius:12px;margin-bottom:10px}
.sess-row + .sess-row::before,.lbrank-row + .lbrank-row::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--line)}
.ios-row + .ios-row::before{content:"";position:absolute;top:0;left:58px;right:0;height:.5px;background:var(--line)}
.sess-row .sr-info b{font-size:17px;font-weight:400}
.sess-row .sr-info span{font-size:15px}
.ios-row-solo{margin-top:12px}
.ios-row-solo + .ios-row{margin-top:0}
.ios-break{height:4px}
.ios-row{width:100%;display:flex;align-items:center;gap:12px;padding:8px 16px;color:var(--text);text-align:left;cursor:pointer;font-size:17px}
.ios-row:active{background:var(--chip)}
.ios-tile{width:30px;height:30px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.ios-row-label{flex:1;min-width:0}
.ios-row-value{color:var(--mute);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
.ios-chev{width:8px;height:8px;border-right:2px solid var(--mute);border-top:2px solid var(--mute);transform:rotate(45deg);
  opacity:.6;margin-left:2px;flex-shrink:0}
.checkin-module-due{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;margin-top:12px;
  background:var(--card);border:none;border-radius:12px;color:var(--text);cursor:pointer;animation:none;
  box-shadow:inset 0 0 0 1.5px var(--accent2)}
.ios-danger-row{width:100%;margin:26px 0 10px;min-height:44px;background:var(--card);border:none;border-radius:12px;
  color:var(--bad);font-size:17px;cursor:pointer}

/* Leaderboard rows */
.lbrank-row{padding:10px 16px;gap:12px}
.lbrank-row .lbr-name{font-size:17px;font-weight:600}
.lbrank-row .lbr-stats{font-size:15px}

/* iOS switches for the on/off checkboxes in lists */
.sess-row input[type="checkbox"]{-webkit-appearance:none;appearance:none;width:51px !important;height:31px !important;
  border-radius:16px;background:var(--switch-off);position:relative;flex-shrink:0;cursor:pointer;transition:background .2s;border:none;margin:0}
.sess-row input[type="checkbox"]::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;
  background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .2s}
.sess-row input[type="checkbox"]:checked{background:#34C759}
.sess-row input[type="checkbox"]:checked::after{transform:translateX(20px)}

/* Buttons */
.save-btn,.save-session-btn{border-radius:14px;font-size:17px;font-weight:600;min-height:50px}
.save-session-btn{width:100%;background:var(--accent2);border:none;color:#fff;cursor:pointer;margin:6px 0 4px}
.editor-actions .save-session-btn{width:auto;margin:0}
.addsessbtn,.blank-session-btn,.histbtn,.hiit-history-btn,.restore-default-btn{border:none;background:var(--card);color:var(--accent);
  border-radius:12px;font-size:17px;font-weight:400;min-height:44px}
.rest-chip{border:none;border-radius:9px}
.seg{border:none;border-radius:9px;padding:2px;background:var(--chip)}
.seg button{border-radius:7px;color:var(--text);font-weight:500}
.seg button.active{background:var(--seg-on);color:var(--text);font-weight:600;box-shadow:0 1px 3px var(--shadow)}

/* Fields: filled, no borders */
.setrow input,.editor-field input,.custom-ex-input,.weight-form input,.dx-sets,.dx-reps,.rpe-comment,.checkin-textarea,
.add-ex-row select,.add-ex-row input{border:none !important;border-radius:10px}
.editor-field label{font-size:13px;font-weight:400;text-transform:uppercase;letter-spacing:.02em;color:var(--mute)}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:none;background:var(--bar-bg);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--line);padding:4px 8px calc(4px + var(--safe-bot))}
body.has-tabbar .tabbar{display:block}
.tabbar-inner{max-width:500px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tabbar button{background:none;border:none;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:10px;font-weight:600;min-height:50px;justify-content:center;cursor:pointer}
.tabbar button.active{color:var(--accent)}
body.has-tabbar .app-update-banner{bottom:calc(74px + var(--safe-bot))}

/* Live session: compact nav bar */
.topbar.session-nav{position:sticky;top:0;z-index:40;display:grid;grid-template-columns:1fr auto 1fr;grid-template-areas:none;
  align-items:center;margin:-6px -16px 14px;padding:4px 12px 6px;background:var(--bar-bg);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--line)}
.topbar.session-nav > *{grid-area:auto !important}
.sn-title{text-align:center;min-width:0}
.sn-name{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.sn-sub{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.sn-right{justify-self:end}
.session-finish-btn,.session-nav .start-session-btn{height:32px;padding:0 15px;border-radius:16px;border:none;background:var(--accent2);
  color:#fff;font-size:15px;font-weight:600;cursor:pointer;min-width:0}

/* Live session: exercise cards */
.ex,.ss-card{padding:14px 16px 8px;margin-bottom:14px}
.ex-num{border:none;min-width:26px;height:26px;border-radius:8px}
.ex-swap-btn{width:32px;height:32px;border-radius:16px;border:none;background:var(--chip);color:var(--text);
  display:inline-flex;align-items:center;justify-content:center;padding:0}
.setn{border:none}
.setrow:has(.tick.on) .setn:not([data-type="warmup"]):not([data-type="dropset"]):not([data-type="failure"]){background:var(--good-tint);color:var(--good)}
.tick{border:none;border-radius:10px}
.tick.on{background:var(--good);color:var(--paper)}
.addset-btn{color:var(--accent);font-size:15px;font-weight:600;min-height:40px;padding:0 2px}
.add-mid-session-btn{width:100%;min-height:50px;border-radius:12px;border:1.5px dashed var(--line);background:none;
  color:var(--accent);font-size:17px;font-weight:600;cursor:pointer;margin:2px 0 6px}
.ss-badge{border-radius:11px;padding:4px 9px;font-size:11px;letter-spacing:.06em}

/* Live session: rest panel fixed to the bottom */
.rest-panel{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--bar-bg);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--line);padding:8px 16px calc(12px + var(--safe-bot))}
.rest-panel > *{max-width:468px;margin-left:auto;margin-right:auto}
.rest-panel-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.rest-panel .rest-display{flex:none;background:none;border:none;border-radius:0;color:var(--mute);font-size:17px;font-weight:600;
  text-align:left;padding:0;min-height:44px;min-width:100px;font-variant-numeric:tabular-nums;cursor:pointer}
.rest-panel .rest-display.running{background:none;color:var(--text);font-size:34px;font-weight:700;line-height:40px}
.rest-seg{width:200px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.rest-seg .rest-chip{background:none;border:none;color:var(--text);height:32px;font-size:15px;font-weight:600;border-radius:7px;cursor:pointer}
.rest-seg .rest-chip.active{background:var(--seg-on);box-shadow:0 1px 3px var(--shadow)}
.rest-track{height:4px;border-radius:2px;background:var(--chip);margin-top:6px;overflow:hidden}
.rest-fill{height:100%;width:0;background:var(--accent2)}
.rest-panel-spacer{height:110px}

/* Grouped-row extras */
.ios-row-sub{display:block;font-size:15px;color:var(--mute);margin-top:1px}
.pill{display:inline-block;font-size:13px;font-weight:600;padding:3px 8px;border-radius:6px}
.pill-good{background:var(--good-tint);color:var(--good)}
.pill-warn{background:var(--warn-tint);color:var(--warn)}
.photo-upload-btn{border:none;border-radius:10px;background:var(--chip);color:var(--accent);font-size:15px;font-weight:600}
.loading,.lb-loading{font-size:15px}
</style>

    _syncChipShown = false;

// before this change and any earlier write that didn't land). Runs quietly.

// Each person lives in their own document (people/{profileId}) so security
// rules can let people edit only their own record. PEOPLE stays a plain array
// for the rest of the app; savePeople() works out which records changed and
// writes just those.
let PEOPLE_SAVED = new Map(); // id -> JSON as last read/written
function personRef(id){ return doc(db, "people", id); }
function rememberPeopleSnapshot(){ PEOPLE_SAVED = new Map(PEOPLE.map(p=>[p.id, stableJson(p)])); }

// The people directory is kept live with a listener: the first answer comes
// from the phone's copy (instant), later server updates are merged in.
let _peopleUnsub = null, _peopleReady = null, _peopleLive = false, _peopleMigrating = false;
function stopPeopleListener(){ if(_peopleUnsub){ _peopleUnsub(); _peopleUnsub = null; } _peopleReady = null; _peopleLive = false; }

function adoptServerPeople(docs){
  // Merge server records in, but never clobber a local edit that hasn't synced yet.
  let changed = false;
  const serverIds = new Set();
  docs.forEach(d=>{
    const data = d.data(); serverIds.add(d.id);
    const sj = stableJson(data);
    if(PEOPLE_SAVED.get(d.id) === sj) return;
    const idx = PEOPLE.findIndex(p=>p.id===d.id);
    const local = idx>=0 ? PEOPLE[idx] : null;
    if(local && PEOPLE_SAVED.has(d.id) && stableJson(local) !== PEOPLE_SAVED.get(d.id)) return; // unsynced local edit wins
    if(idx>=0) PEOPLE[idx] = data; else PEOPLE.push(data);
    PEOPLE_SAVED.set(d.id, sj); changed = true;
  });
  [...PEOPLE_SAVED.keys()].forEach(id=>{
    if(serverIds.has(id)) return;
    PEOPLE = PEOPLE.filter(p=>p.id!==id); PEOPLE_SAVED.delete(id); changed = true;
  });
  if(changed && CURRENT_PROFILE){
    CURRENT_PROFILE = PEOPLE.find(p=>p.id===CURRENT_PROFILE.id) || CURRENT_PROFILE;
  }
  return changed;
}

function loadPeople(){
  if(_peopleReady && _peopleLive) return _peopleReady; // already live and up to date
  stopPeopleListener();
  _peopleReady = new Promise(resolve=>{
    let settled = false;
    const settle = ok=>{
      if(settled) return; settled = true; clearTimeout(timer);
      if(!ok){
        // Display-only fallback: never saved, or it would replace the real directory.
        PEOPLE = JSON.parse(JSON.stringify(DEFAULT_PEOPLE));
        PEOPLE_LOAD_FAILED = true;
      }
      resolve();
    };
    const timer = setTimeout(()=>settle(false), 10000);
    try{
      _peopleUnsub = onSnapshot(collection(db, "people"), {includeMetadataChanges:true}, async qs=>{
        const fromCache = qs.metadata.fromCache;
        if(_peopleMigrating) return; // our own migration writes echoing back
        if(!settled){
          if(!qs.empty){
            PEOPLE = qs.docs.map(d=>d.data());
            PEOPLE_LOAD_FAILED = false;
            rememberPeopleSnapshot();
            _peopleLive = true;
            settle(true);
          } else if(!fromCache){
            // Server says the collection is empty: one-off migration from the old meta/people document.
            _peopleMigrating = true;
            try{
              const legacy = await getDoc(peopleDocRef());
              PEOPLE = (legacy.exists() && Array.isArray(legacy.data().list)) ? legacy.data().list : [];
              PEOPLE_LOAD_FAILED = false;
              PEOPLE_SAVED = new Map();
              if(PEOPLE.length) await savePeople();
              _peopleLive = true;
              _peopleMigrating = false;
              settle(true);
            }catch(e){ _peopleMigrating = false; settle(false); }
          }
          return; // empty phone copy: wait for the server
        }
        if(qs.metadata.hasPendingWrites) return; // our own write echoing back
        if(PEOPLE_LOAD_FAILED){
          PEOPLE = qs.docs.map(d=>d.data()); PEOPLE_LOAD_FAILED = false; rememberPeopleSnapshot();
          if(CURRENT_PROFILE) CURRENT_PROFILE = PEOPLE.find(p=>p.id===CURRENT_PROFILE.id) || CURRENT_PROFILE;
          refreshVisibleScreen(); return;
        }
        if(adoptServerPeople(qs.docs)) refreshVisibleScreen();
      }, ()=>{ _peopleLive = false; settle(false); });
    }catch(e){ settle(false); }
  });
  return _peopleReady;
}
async function savePeople(){
  if(PEOPLE_LOAD_FAILED) return false;
  let ok = true;
  const currentIds = new Set();
  for(const p of PEOPLE){
    if(!p || !p.id) continue;
    currentIds.add(p.id);
    const sj = stableJson(p);
    if(PEOPLE_SAVED.get(p.id) === sj) continue; // unchanged
    const prev = PEOPLE_SAVED.get(p.id);
    PEOPLE_SAVED.set(p.id, sj);
    let wrote = false;
    try{ wrote = await commitWrite(setDoc(personRef(p.id), plainCopy(p))); }catch(e){}
    if(!wrote){ ok = false; if(prev===undefined) PEOPLE_SAVED.delete(p.id); else PEOPLE_SAVED.set(p.id, prev); }
  }
  for(const id of [...PEOPLE_SAVED.keys()]){
    if(currentIds.has(id)) continue;
    const prev = PEOPLE_SAVED.get(id);
    PEOPLE_SAVED.delete(id);
    let wrote = false;
    try{ wrote = await commitWrite(deleteDoc(personRef(id))); }catch(e){}
    if(!wrote){ ok = false; PEOPLE_SAVED.set(id, prev); }
  }
  return ok;
}

const CARDIO_ACTIVITIES = ["Walking","Running","Treadmill","Cycling","Stationary bike","Rowing machine","Elliptical","Stairmaster","Swimming","Hiking","Jump rope","Ski erg"];

let LOG = [];
let WEIGHTS = [];
let MEASUREMENTS = [];
let STORAGE_AVAILABLE = true;
const MEASURE_METRICS = [{id:"waist",label:"Waist"},{id:"chest",label:"Chest"},{id:"arms",label:"Arms"}];
let currentMeasureMetric = "waist";

// Your tracker document is kept live: the first answer comes from the
// phone's copy, so the app opens instantly; later changes from the server
// (another device, a trainer's feedback or plan edit) are merged in.
const TRACKER_FIELDS = ["log","weights","measurements","plan","hiitClasses","cardioLog","checkIns","drafts"];
let TRACKER_SAVED = {}; // field -> stableJson as last read/written
let _trackerUnsub = null;
function trackerField(f){
  return {log:LOG, weights:WEIGHTS, measurements:MEASUREMENTS, plan:PLAN, hiitClasses:HIIT_CLASSES,
          cardioLog:CARDIO_LOG, checkIns:CHECKINS, drafts:DRAFTS}[f];
}
function setTrackerField(f, v){
  if(f==="log") LOG = v||[];
  else if(f==="weights") WEIGHTS = v||[];
  else if(f==="measurements") MEASUREMENTS = v||[];
  else if(f==="plan") PLAN = v||[];
  else if(f==="hiitClasses") HIIT_CLASSES = v||[];
  else if(f==="cardioLog") CARDIO_LOG = v||[];
  else if(f==="checkIns") CHECKINS = v||[];
  else if(f==="drafts") DRAFTS = v||{};
}
function applyTrackerData(d){
  d = d || {};
  TRACKER_FIELDS.forEach(f=>setTrackerField(f, d[f]));
  TRACKER_SAVED = {};
  TRACKER_FIELDS.forEach(f=>{ TRACKER_SAVED[f] = stableJson(trackerField(f)); });
}
function stopTrackerListener(){ if(_trackerUnsub){ _trackerUnsub(); _trackerUnsub = null; } }

function loadLog(){
  stopTrackerListener();
  return new Promise(resolve=>{
    let settled = false;
    const settle = ok=>{
      if(settled) return; settled = true; clearTimeout(timer);
      STORAGE_AVAILABLE = ok;
      if(!ok) applyTrackerData({}); // empty placeholders; saveLog refuses to write them
      resolve();
    };
    // No copy on this phone and no answer from the server within 10s: give up
    // for now (banner + Try again). If the server answers later, we recover.
    const timer = setTimeout(()=>settle(false), 10000);
    try{
      _trackerUnsub = onSnapshot(profileDocRef(), {includeMetadataChanges:true}, snap=>{
        const fromCache = snap.metadata.fromCache;
        if(!settled){
          if(snap.exists()){ applyTrackerData(snap.data()); settle(true); }
          else if(!fromCache){ applyTrackerData({}); settle(true); } // genuinely new user
          return; // nothing on the phone yet: wait for the server
        }
        if(snap.metadata.hasPendingWrites) return; // our own write echoing back
        if(!STORAGE_AVAILABLE){
          // Late answer after the timeout: load it properly now.
          if(snap.exists() || !fromCache){ applyTrackerData(snap.exists()?snap.data():{}); STORAGE_AVAILABLE = true; refreshVisibleScreen(); }
          return;
        }
        if(!snap.exists()) return;
        const d = snap.data();
        let changed = false;
        TRACKER_FIELDS.forEach(f=>{
          const sj = stableJson(d[f] === undefined ? (f==="drafts"?{}:[]) : d[f]);
          if(sj === TRACKER_SAVED[f]) return;                          // nothing new from the server
          if(stableJson(trackerField(f)) !== TRACKER_SAVED[f]) return;  // unsynced local edit wins
          setTrackerField(f, d[f]); TRACKER_SAVED[f] = sj; changed = true;
        });
        if(changed) refreshVisibleScreen();
      }, ()=>settle(false));
    }catch(e){ settle(false); }
  });
}
// ── One-off admin migrations ───────────────────────────────
// Run from the admin's login (the only one allowed to write for others):
// copies the old shared login lookups into one-per-name documents, and
// creates a leaderboard summary for everyone who hasn't opened the new
// version yet. Recorded in meta/migrations so each runs once.
async function runAdminMigrations(){
  try{
    const mref = doc(db, "meta", "migrations");
    const msnap = await getDoc(mref);
    const done = msnap.exists() ? msnap.data() : {};
    const byUsername = u => PEOPLE.find(p=>lkey(p.username)===lkey(u));
    if(!done.lookupsV2){
      const [un, le] = await Promise.all([getDoc(doc(db,"meta","username-lookup")).catch(()=>null), getDoc(doc(db,"meta","login-lookup")).catch(()=>null)]);
      const umap = (un && un.exists() && un.data().map) || {}, emap = (le && le.exists() && le.data().map) || {};
      for(const [u, email] of Object.entries(umap)){
        const person = byUsername(u);
        if(!person || !person.uid) continue;
        const ex = await getDoc(usernameRef(u)).catch(()=>null);
        if(ex && !ex.exists()) await setDoc(usernameRef(u), {email:String(email||""), uid:person.uid}).catch(()=>{});
      }
      for(const [email, u] of Object.entries(emap)){
        const person = byUsername(u);
        if(!person || !person.uid) continue;
        const ex = await getDoc(emailRef(email)).catch(()=>null);
        if(ex && !ex.exists()) await setDoc(emailRef(email), {username:String(u||""), uid:person.uid}).catch(()=>{});
      }
      await setDoc(mref, {lookupsV2:true}, {merge:true});
    }
    if(!done.leaderboardV1){
      for(const p of PEOPLE){
        if(p.id===CURRENT_PROFILE.id) continue;
        const ex = await getDoc(leaderboardRef(p.id)).catch(()=>null);
        if(!ex || ex.exists()) continue;
        const t = await getDoc(doc(db, "trackers", `${TRACKER_ID}-${p.id}`)).catch(()=>null);
        const log = (t && t.exists() && t.data().log) || [];
        await setDoc(leaderboardRef(p.id), {dates:summaryFromLog(log).dates, updatedAt:new Date().toISOString()}).catch(()=>{});
      }
      await setDoc(mref, {leaderboardV1:true}, {merge:true});
    }
  }catch(e){ /* tries again next time the admin opens the app */ }
}

// ── Leaderboard summary ───────────────────────────────────
// Trackers are private, so the leaderboard reads a small public summary per
// person instead: just the dates of their sessions (no weights, notes or
// anything else). Kept up to date whenever your log changes.
function leaderboardRef(pid){ return doc(db, "leaderboard", pid); }
function summaryFromLog(log){ return {dates:(log||[]).map(e=>e && e.date).filter(Boolean).sort()}; }
let LB_SAVED = null;
async function syncMySummary(){
  if(!STORAGE_AVAILABLE || !CURRENT_PROFILE) return;
  const sum = summaryFromLog(LOG), sj = stableJson(sum);
  if(LB_SAVED === null){
    try{ const snap = await getDocCacheFirst(leaderboardRef(CURRENT_PROFILE.id)); if(snap.exists()) LB_SAVED = stableJson({dates:snap.data().dates||[]}); }catch(e){}
  }
  if(sj === LB_SAVED) return;
  LB_SAVED = sj;
  const ok = await commitWrite(setDoc(leaderboardRef(CURRENT_PROFILE.id), {dates:sum.dates, updatedAt:new Date().toISOString()}));
  if(!ok) LB_SAVED = null;
}

async function saveLog(){
  // If the load failed, the in-memory arrays are empty placeholders. Writing
  // them would wipe the real history in Firestore, so refuse until a reload works.
  if(!STORAGE_AVAILABLE) return false;
  // Only send the fields that actually changed. That keeps writes small and
  // means saving a session can't overwrite a trainer's feedback that arrived
  // in the meantime.
  const patch = {}, prev = {};
  TRACKER_FIELDS.forEach(f=>{
    const sj = stableJson(trackerField(f));
    if(sj !== TRACKER_SAVED[f]){ patch[f] = plainCopy(trackerField(f)); prev[f] = TRACKER_SAVED[f]; TRACKER_SAVED[f] = sj; }
  });
  const fields = Object.keys(patch);
  if(!fields.length) return true;
  patch.updatedAt = new Date().toISOString();
  let ok = false;
  // mergeFields replaces each listed field wholesale (so deleted drafts really
  // go) and leaves every other field untouched.
  try{ ok = await commitWrite(setDoc(profileDocRef(), patch, {mergeFields:[...fields, "updatedAt"]})); }catch(e){ ok = false; }
  if(!ok) fields.forEach(f=>{ TRACKER_SAVED[f] = prev[f]; });
  if(ok && fields.includes("log")) syncMySummary();
  return ok;
}

const $ = id => document.getElementById(id);
// Escape free text (comments, notes) before it goes into innerHTML, so a
// stray "<" can't break the layout or run script on a trainer's screen.
const esc = v => String(v==null?"":v).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// A value passed as an argument inside an inline handler, e.g.
// onclick="fn(${jsArg(name)})": a quoted JS string, made safe for the HTML attribute.
const jsArg = v => esc(JSON.stringify(String(v==null?"":v)));
const app = $("app");
const fmtDate = iso => new Date(iso).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
const timeAgo = iso => {
  const days = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
  if(days<=0) return "today";
  if(days===1) return "yesterday";
  if(days<14) return `${days} days ago`;
  const weeks = Math.floor(days/7);
  return `${weeks} week${weeks!==1?"s":""} ago`;
};
const lastOf = id => [...LOG].filter(w=>w.sessionId===id).sort((a,b)=>b.date.localeCompare(a.date))[0];

// Local calendar-day string (YYYY-MM-DD), using the browser's local date
// components rather than the UTC date toISOString() would give. Using UTC
// here was the source of a real bug: anyone in a timezone ahead of UTC (UK
// during BST, for instance) would have "today" silently resolve to the UTC
// date, which can be a full day behind local midnight - sessions logged
// today were vanishing from the heatmap entirely. Every day-bucketing
// feature in the app should go through this one function.
function localDayKey(d){
  const dt = (d instanceof Date) ? d : new Date(d);
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`;
}
function dayKey(iso){ return localDayKey(iso); }
function trainedDaysSetFor(log){ return new Set(log.map(w=>dayKey(w.date))); }

function weekStreakFor(log){
  const days = trainedDaysSetFor(log);
  function weekHasSession(weekStart){
    for(let i=0;i<7;i++){
      const d = new Date(weekStart); d.setDate(d.getDate()+i);
      if(days.has(localDayKey(d))) return true;
    }
    return false;
  }
  const now = new Date();
  const dow = (now.getDay()+6)%7; // 0 = Monday
  let weekStart = new Date(now); weekStart.setDate(now.getDate()-dow); weekStart.setHours(0,0,0,0);
  let streak = 0;
  let cursor = new Date(weekStart);
  while(weekHasSession(cursor)){
    streak++;
    cursor.setDate(cursor.getDate()-7);
  }
  return streak;
}

function sessionsInRange(log, startISO, endISO){
  return log.filter(w=>w.date>=startISO && w.date<endISO).length;
}

function buildHeatmap(log){
  const days = trainedDaysSetFor(log);
  const today = new Date(); today.setHours(0,0,0,0);
  const totalDays = 84;
  let start = new Date(today); start.setDate(today.getDate()-totalDays+1);
  const dow = (start.getDay()+6)%7;
  start.setDate(start.getDate()-dow);
  const cells = [];
  let cursor = new Date(start);
  while(cursor<=today){
    const key = localDayKey(cursor);
    cells.push({date:key, trained:days.has(key)});
    cursor.setDate(cursor.getDate()+1);
  }
  const cols = [];
  for(let i=0;i<cells.length;i+=7) cols.push(cells.slice(i,i+7));
  const colsHtml = cols.map(week=>{
    const squares = week.map(c=>`<div class="heat-cell ${c.trained?"on":""}" title="${c.date}"></div>`).join("");
    return `<div class="heat-col">${squares}</div>`;
  }).join("");
  const dayLetters = ["M","T","W","T","F","S","S"];
  const labelsHtml = dayLetters.map(d=>`<div class="heat-daylabel">${d}</div>`).join("");
  return `<div class="heat-outer">
    <div class="heat-daylabels">${labelsHtml}</div>
    <div class="heat-wrap"><div class="heat-grid">${colsHtml}</div></div>
  </div>`;
}

function allTimeBest(exerciseName){
  let best = null;
  LOG.forEach(session=>{
    session.ex.forEach(e=>{
      if(e.n!==exerciseName) return;
      e.sets.forEach(s=>{
        const w = parseFloat(s.w);
        if(isNaN(w)) return;
        const r = parseInt(s.r)||0;
        if(!best || w>best.weight || (w===best.weight && r>best.reps)){
          best = {weight:w, reps:r};
        }
      });
    });
  });
  return best;
}

// ── Rest timer ─────────────────────────────────────────────
// Counts down to a fixed end time rather than subtracting a second at a time,
// so locking the phone or switching apps can't freeze it: on return it shows
// the true time left (or that rest is over).
let restInterval=null, restRemaining=0, restEndsAt=0, restTotalMs=0, restPreset=0;
function fmtRest(sec){ return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")}`; }
function startRest(seconds, endsAt){
  clearInterval(restInterval);
  restEndsAt = endsAt || (Date.now() + seconds*1000);
  restPreset = seconds || 0;
  restTotalMs = Math.max(1000, seconds ? seconds*1000 : (restEndsAt - Date.now()));
  maybeShowSoundTip();
  restInterval = setInterval(tickRest, 250);
  tickRest();
  if(typeof scheduleAutosave === "function") scheduleAutosave();
}
function tickRest(){
  if(!restInterval) return;
  const left = Math.ceil((restEndsAt - Date.now())/1000);
  if(left<=0){
    const lateBy = Date.now() - restEndsAt;
    clearInterval(restInterval); restInterval=null; restRemaining=0; restEndsAt=0;
    renderRest();
    // Only beep if we're on time; coming back to the app long after, a
    // sudden beep would be confusing, so just say so.
    if(lateBy < 2000 && !document.hidden){ buzz([200,100,200]); playBeep(); showToast("\u23F1 Rest over \u2014 back to it!"); }
    else showToast("\u23F1 Rest finished while you were away");
    if(typeof scheduleAutosave === "function") scheduleAutosave();
    return;
  }
  if(left !== restRemaining){ restRemaining = left; renderRest(); }
  else { const fill = $("restFill"); if(fill) fill.style.width = `${Math.min(100, 100*Math.max(0, restEndsAt - Date.now())/Math.max(restTotalMs, 1))}%`; }
}
function cancelRest(){
  clearInterval(restInterval); restInterval=null; restRemaining=0; restEndsAt=0; renderRest();
  if(typeof scheduleAutosave === "function") scheduleAutosave();
}
function renderRest(){
  const el = $("restDisplay");
  if(!el) return;
  if(restInterval){
    el.textContent = fmtRest(restRemaining);
    el.classList.add("running");
  } else {
    el.textContent = "Rest";
    el.classList.remove("running");
  }
  const fill = $("restFill");
  if(fill){
    const left = restInterval ? Math.max(0, restEndsAt - Date.now()) : 0;
    fill.style.width = restInterval ? `${Math.min(100, 100*left/Math.max(restTotalMs, left))}%` : "0%";
  }
  document.querySelectorAll(".rest-chip[data-sec]").forEach(b=>b.classList.toggle("active", !!restInterval && +b.dataset.sec===restPreset));
}

// ── Keep the screen on mid-workout ─────────────────────────
// While a gym session is started or a HIIT class is running, ask the phone
// not to auto-lock (Screen Wake Lock, iOS 16.4+). The phone drops the lock
// whenever the app is hidden, so it's re-requested when you come back.
let _wakeLock = null, _wakeRunning = false, _wakeAgain = false;
function wantsWakeLock(){
  return !!((sessionState && sessionState.started) || (hiitState && hiitState.running && !hiitState.done));
}
// Calls can overlap (a tap and the app coming back, say): run one at a time
// so we never hold two locks and only release one of them.
async function updateWakeLock(){
  if(_wakeRunning){ _wakeAgain = true; return; }
  _wakeRunning = true;
  try{
    do{
      _wakeAgain = false;
      try{
        if(!("wakeLock" in navigator)) break;
        if(wantsWakeLock() && !document.hidden){
          if(!_wakeLock || _wakeLock.released){
            const lock = await navigator.wakeLock.request("screen");
            lock.addEventListener("release", ()=>{ if(_wakeLock===lock) _wakeLock = null; });
            _wakeLock = lock;
          }
        } else if(_wakeLock){
          const l = _wakeLock; _wakeLock = null; await l.release();
        }
      }catch(e){ _wakeLock = null; }
    } while(_wakeAgain);
  } finally { _wakeRunning = false; }
}
setInterval(updateWakeLock, 10000); // safety net for any path that changes state

// ── Sound ──────────────────────────────────────────────────
// iPhones only allow sound from an audio player that was started by a tap,
// and limit how many players a page can create. So: one shared player,
// switched on by the first tap anywhere, reused for every beep.
let _audioCtx = null;
function unlockAudio(){
  try{
    if(!_audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      _audioCtx = new AC();
    }
    if(_audioCtx.state !== "running") _audioCtx.resume().catch(()=>{});
    // A silent blip inside the tap is what actually unlocks audio on iOS.
    const b = _audioCtx.createBuffer(1, 1, 22050), src = _audioCtx.createBufferSource();
    src.buffer = b; src.connect(_audioCtx.destination); src.start(0);
  }catch(e){}
}
["pointerdown","touchend","click"].forEach(ev=>document.addEventListener(ev, unlockAudio, {capture:true, passive:true}));
function buzz(pattern){ try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){} }
function playBeep(){
  try{
    const ctx = _audioCtx;
    if(!ctx) return;
    if(ctx.state !== "running") ctx.resume().catch(()=>{});
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type="sine"; o.frequency.value=880;
    o.connect(g); g.connect(ctx.destination);
    const t = ctx.currentTime;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.3, t+0.02);
    o.start(t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.5);
    o.stop(t+0.55);
  }catch(e){}
}

// Firestore writes made in the instant right after createUserWithEmailAndPassword
// can occasionally fail even though the account creation itself succeeded -
// there's a brief window where the auth token isn't fully propagated yet.
// A short retry absorbs that without masking a genuine, persistent failure.
async function writeWithRetry(fn, attempts){
  attempts = attempts || 3;
  let lastErr;
  for(let i=0;i<attempts;i++){
    try{ return await fn(); }
    catch(e){ lastErr = e; if(i<attempts-1) await new Promise(r=>setTimeout(r, 400)); }
  }
  throw lastErr;
}

function uniquePersonId(name){
  const base = slugify(name);
  let id = base, n = 2;
  while(PEOPLE.some(p=>p.id===id)){ id = `${base}-${n}`; n++; }
  return id;
}

async function submitAuth(){
  const input = ($("authUsername").value||"").trim();
  const password = $("authPassword").value||"";
  if(!input || !password){ authError="Enter your username/email and password."; renderAuthScreen(); return; }

  if(authMode==="login"){
    const looksLikeEmail = input.includes("@");

    if(looksLikeEmail){
      // New-scheme accounts are registered directly under their real email now.
      try{
        await signInWithEmailAndPassword(auth, input, password);
        return;
      }catch(directErr){
        // Only fall back if no account exists under that email at all - a
        // genuine wrong-password on an existing account should surface as-is,
        // not get masked by a confusing second attempt.
        if(directErr && (directErr.code==="auth/user-not-found" || directErr.code==="auth/invalid-email")){
          const legacyUsername = await getUsernameForEmail(input);
          if(legacyUsername){
            try{
              await signInWithEmailAndPassword(auth, usernameToEmail(legacyUsername), password);
              return;
            }catch(e){ /* fall through to generic error below */ }
          }
        }
        authError = "Couldn't log in. Check your username/email and password.";
        renderAuthScreen();
        return;
      }
    } else {
      // Username path: try the new lookup's real email first, but a real
      // email change isn't instant any more (Firebase requires clicking a
      // verification link before it actually takes effect) - so during that
      // window the lookup can point at an email Firebase hasn't activated
      // yet. Always fall back to the legacy placeholder-email derivation
      // before giving up, rather than failing outright.
      const resolvedEmail = await getEmailForUsername(input);
      const candidates = resolvedEmail ? [resolvedEmail, usernameToEmail(input)] : [usernameToEmail(input)];
      for(const candidate of candidates){
        try{
          await signInWithEmailAndPassword(auth, candidate, password);
          return;
        }catch(e){ /* try next candidate */ }
      }
      authError = "Couldn't log in. Check your username/email and password.";
      renderAuthScreen();
      return;
    }
  }

  // signup - everyone goes through the same generic flow now; the original
  // Ed/Tara "claim your existing profile" step was only needed for the
  // one-time migration when auth was first introduced, and that's done.
  const username = input;
  const password2 = $("authPassword2") ? $("authPassword2").value : "";
  const realEmail = ($("authEmail")?.value||"").trim();
  const displayName = ($("authDisplayName")?.value||"").trim();
  if(!displayName){ authError="Enter your name."; renderAuthScreen(); return; }
  if(!realEmail || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(realEmail)){
    authError = "Enter a valid email address.";
    renderAuthScreen();
    return;
  }
  if(password.length<6){ authError="Password needs to be at least 6 characters."; renderAuthScreen(); return; }
  if(password!==password2){ authError="Passwords don't match."; renderAuthScreen(); return; }
  if(!signupLocations.length){ authError="Pick at least one gym location."; renderAuthScreen(); return; }

  const usernameTaken = await getEmailForUsername(username);
  if(usernameTaken){
    authError = "That username is already taken \u2014 please choose another.";
    renderAuthScreen();
    return;
  }

  const role = signupRole || "client";
  const locations = role==="client" ? signupLocations.slice(0,1) : [...signupLocations];
  signupInProgress = true;
  let cred = null;
  let profileId = null;
  let claimedUsername = false;
  try{
    // Registered directly under the real email now, so genuine password-reset
    // emails have somewhere real to go - no more synthetic placeholder address.
    cred = await createUserWithEmailAndPassword(auth, realEmail, password);
    // Claim the username before anything else: if someone got there first,
    // stop now and roll the login back.
    if(!(await claimUsername(username, realEmail, cred.user.uid))){
      const err = new Error("username taken"); err.code = "username-taken"; throw err;
    }
    claimedUsername = true;
    await loadPeople(); // now signed in, so the directory is readable
    profileId = uniquePersonId(displayName);
    // Trainer accounts need an admin's approval: start as a client with a request.
    const newPerson = {id:profileId, name:displayName, role:"client", clientIds:[], uid:cred.user.uid, email:realEmail, username, locations};
    if(role==="trainer") newPerson.requestedRole = "trainer";
    PEOPLE.push(newPerson);
    // Person record first: the security rules only allow the uid mapping once
    // a person record owned by this login exists.
    await writeWithRetry(async()=>{ if(!(await savePeople())) throw new Error("people write failed"); });
    await writeWithRetry(()=>setDoc(doc(db,"users",cred.user.uid), {profileId}));
    await registerLoginLookup(realEmail, username, cred.user.uid);
    if(role==="trainer") setTimeout(()=>showToast("Trainer access requested \u2014 an admin will approve it"), 1500);
    // createUserWithEmailAndPassword auto-signs the user in, which fires the
    // auth listener immediately - before the writes just above had finished.
    // That race used to make the very next boot fail to find the profile it
    // hadn't been written yet, sign the user back out, and show a confusing
    // error. Booting explicitly here, now that everything is confirmed
    // written, avoids that entirely.
    signupInProgress = false;
    await bootForUser(cred.user);
  }catch(e){
    signupInProgress = false;
    if(cred && claimedUsername){ try{ await removeFromUsernameLookup(username); }catch(x){} }
    if(cred && profileId){
      // Tidy away the half-made person record so it doesn't linger in lists.
      PEOPLE = PEOPLE.filter(p=>p.id!==profileId);
      try{ await savePeople(); }catch(cleanupErr){ /* best effort */ }
    }
    if(cred){
      // The login was created but the profile write never completed even
      // after retrying - roll the login back too, rather than leaving an
      // orphaned account with no profile that silently blocks this email
      // from ever being used to sign up again.
      try{ await deleteUser(cred.user); }catch(rollbackErr){ /* best effort */ }
    }
    if(e && e.code==="username-taken"){
      authError = "That username is already taken \u2014 please choose another.";
    } else if(e && e.code==="auth/email-already-in-use"){
      authError = "That email is already registered.";
    } else {
      authError = `Couldn't create that account (${(e&&e.code)||"unknown error"}). Please try again.`;
    }
    renderAuthScreen();
  }
}

async function bootForUser(user){
  if(!user){
    CURRENT_PROFILE = null;
    renderAuthScreen();
    return;
  }
  app.innerHTML = `<div class="loading">Loading your data&hellip;</div>`;

  // loadPeople, loadLocations, and the user->profile mapping lookup are all
  // independent of each other, so run them concurrently rather than one
  // after another — this is the main lever on cold-start time, since each
  // round trip to Firestore was previously blocking the next.
  const peopleP = loadPeople(), locationsP = loadLocations();
  const mappingSnap = await getDocCacheFirst(doc(db,"users",user.uid)).catch(()=>({_offline:true}));
  if(mappingSnap && mappingSnap._offline){
    // Couldn't reach the server and nothing is stored on this phone yet.
    // Don't treat that as "no profile" (which signs you out): wait for signal.
    app.innerHTML = `<div class="loading" style="padding:60px 24px;text-align:center">
      <div style="font-size:34px;margin-bottom:10px">&#128246;</div>
      <b>You're offline</b><br><span style="color:var(--mute);font-size:13px">This phone doesn't have your data saved yet. Connect to the internet and it will load automatically.</span><br>
      <button class="save-session-btn" style="margin-top:16px" onclick="location.reload()">Try again</button></div>`;
    window.addEventListener("online", ()=>bootForUser(user), {once:true});
    return;
  }
  await Promise.all([peopleP, locationsP]);
  let mapping = (mappingSnap && mappingSnap.exists && mappingSnap.exists()) ? mappingSnap.data() : null;

  await ensureEdIsAdmin(); // needs PEOPLE, which just resolved above

  // If no UID mapping exists yet, check whether this Google account's email
  // is already linked to a profile from a prior email/password signup —
  // if so, reuse that profile rather than creating a duplicate.
  if(!mapping || !mapping.profileId){
    const isGoogle = user.providerData && user.providerData.some(p=>p.providerId==="google.com");
    if(isGoogle && user.email){
      const username = await getUsernameForEmail(user.email);
      if(username){
        const existing = PEOPLE.find(p=>p.username===username || p.email===user.email);
        if(existing){
          await writeWithRetry(()=>setDoc(doc(db,"users",user.uid),{profileId:existing.id}));
          if(!existing.uid){ existing.uid = user.uid; await savePeople(); }
          mapping = {profileId: existing.id};
        }
      }
    }
    if(!mapping || !mapping.profileId){
      if(isGoogle){
        // Brand new Google user — show the lightweight finish-setup screen
        showGoogleFinishSetup(user);
        return;
      }
      authError = "Couldn't find your profile. Please contact your admin.";
      await signOut(auth);
      return;
    }
  }

  CURRENT_PROFILE = PEOPLE.find(p=>p.id===mapping.profileId) || {id:mapping.profileId, name:mapping.profileId, role:"client", clientIds:[]};
  // Older profiles were created before records were tied to a login. Stamp
  // this login's uid on now: the security rules use it to decide who can edit what.
  if(!PEOPLE_LOAD_FAILED && PEOPLE.includes(CURRENT_PROFILE) && !CURRENT_PROFILE.uid){
    CURRENT_PROFILE.uid = user.uid;
    // Wait for the server here: your tracker is only readable once this lands.
    try{ await setDoc(personRef(CURRENT_PROFILE.id), plainCopy(CURRENT_PROFILE)); PEOPLE_SAVED.set(CURRENT_PROFILE.id, stableJson(CURRENT_PROFILE)); }
    catch(e){ await savePeople(); }
  }
  await loadLog();
  await deduplicateHiitLog();
  home();
  if(!restoreActiveSession()) restoreActiveHiit(); // if the app was closed mid-workout, drop straight back in
  // Quiet background upkeep (never blocks opening the app).
  ensureMyLookups(); syncMySummary();
  if(CURRENT_PROFILE.role==="admin") runAdminMigrations();
  // Firebase remembers the session, so most future opens skip the login
  // screen entirely and land here directly — this is the one point every
  // user actually reaches, so it's the right place to check for updates
  // rather than relying only on the passive background timers.
  checkForAppUpdate();
}

  const saved = (person && person.homeLayout) || [];

  const merged = saved.filter(m=>HOME_MODULES.some(hm=>hm.id===m.id));
  HOME_MODULES.forEach(m=>{ if(!savedIds.has(m.id)) merged.push({id:m.id, hidden:false}); });
  return merged;
}

// ── Session lifecycle state machine ────────────────────────
// sessionState tracks the in-progress session independent of the saved PLAN
// template, so exercises can be added/swapped mid-session without touching
// the template until the user explicitly chooses to at save time.
let sessionState = null; // {id, started, workingEx, originalEx}

// A freeform session not tied to any saved template — exercises get added
// one at a time as you go, via the same "Add Exercise" mechanism used for
// editing a template session mid-workout. Uses a fixed "adhoc" sessionId so
// weight/rep prefill and history naturally carry forward between freeform
// sessions, the same way it does for template sessions.
function startBlankSession(){
  const draft = DRAFTS["adhoc"];
  if(draft){
    sessionState = {id:"adhoc", started:true, workingEx: draft.workingEx, originalEx: draft.workingEx, adHocName: draft.adHocName||"Freestyle Session", liveSets: draft.setsData};
    _autosaveOff = false;
    renderActiveSessionScreen(draft.setsData);
    startTimer(draft.elapsedSec||0);
    scheduleAutosave();
    updateWakeLock();
    showToast("Resumed your in-progress session \u2713");
    return;
  }
  const name = prompt("Name this session:", "Freestyle Session");
  if(name===null) return; // cancelled
  const trimmed = name.trim() || "Freestyle Session";
  sessionState = {id:"adhoc", started:false, workingEx:[], originalEx:[], adHocName: trimmed};
  renderActiveSessionScreen(null);
}

function openSession(id){
  const p = PLAN.find(x=>x.id===id);
  if(!p) return;
  const draft = DRAFTS[id];

  if(draft){
    sessionState = {id, started:true, workingEx: draft.workingEx, originalEx: JSON.parse(JSON.stringify(p.ex)), liveSets: draft.setsData};
    _autosaveOff = false;
    renderActiveSessionScreen(draft.setsData);
    startTimer(draft.elapsedSec||0);
    scheduleAutosave();
    updateWakeLock();
    showToast("Resumed your in-progress session \u2713");
  } else {
    sessionState = {id, started:false, workingEx: JSON.parse(JSON.stringify(p.ex)), originalEx: JSON.parse(JSON.stringify(p.ex))};
    renderActiveSessionScreen(null);
  }
}

function sessionTemplateChanged(){
  if(!sessionState) return false;
  return JSON.stringify(sessionState.workingEx) !== JSON.stringify(sessionState.originalEx);
}

function renderActiveSessionScreen(resumeSetsData){
  // Re-rendering mid-session (after adding or swapping an exercise, or coming
  // back from the pause prompt) must never wipe what has been typed so far.
  if(!resumeSetsData && sessionState && sessionState.started && sessionState.liveSets) resumeSetsData = sessionState.liveSets;
  const p = PLAN.find(x=>x.id===sessionState.id);
  const isAdHoc = sessionState.id === "adhoc";
  const displayName = isAdHoc ? (sessionState.adHocName||"Freestyle Session") : (p?p.name:"Session");
  const displayFocus = isAdHoc ? "Freestyle session" : (p?p.focus:"");
  const last = lastOf(sessionState.id);
  const workingEx = sessionState.workingEx;

  const blocks = workingEx.map((e,i)=>{
    const resumeBlock = resumeSetsData && resumeSetsData[i] ? resumeSetsData[i] : null;

    if(e.superset){
      const prevA = last && last.ex.find(le=>le.n===e.exA.n);
      const prevB = last && last.ex.find(le=>le.n===e.exB.n);
      const bestA = allTimeBest(e.exA.n), bestB = allTimeBest(e.exB.n);
      const prParts = [];
      if(bestA) prParts.push(`&#127942; PR A: <b>${bestA.weight}kg×${bestA.reps}</b>`);
      if(bestB) prParts.push(`&#127942; PR B: <b>${bestB.weight}kg×${bestB.reps}</b>`);
      const prevHtml = prParts.length ? `<div class="prev">${prParts.join(" &nbsp;·&nbsp; ")}</div>` : "";

      const setPairs = Array.from({length:e.s},(_,si)=>{
        const resumeA = resumeBlock && resumeBlock.A && resumeBlock.A[si];
        const resumeB = resumeBlock && resumeBlock.B && resumeBlock.B[si];
        const pwA = resumeA ? resumeA.w : (prevA&&prevA.sets[si] ? prevA.sets[si].w : "");
        const prA = resumeA ? resumeA.r : (prevA&&prevA.sets[si] ? prevA.sets[si].r : "");
        const pwB = resumeB ? resumeB.w : (prevB&&prevB.sets[si] ? prevB.sets[si].w : "");
        const prB = resumeB ? resumeB.r : (prevB&&prevB.sets[si] ? prevB.sets[si].r : "");
        return `<div class="ss-set-pair">
          <div class="ss-set-n">S${si+1}</div>
          <div class="ss-set-rows">
            <div class="ss-row" data-pw="${pwA}" data-pr="${prA}">
              <div class="ss-row-letter">A</div>
              <input type="number" inputmode="decimal" step="0.5" min="0" class="w-input" value="${pwA!==''?pwA:''}" placeholder="kg">
              <input type="number" inputmode="numeric" min="0" class="r-input" value="${prA!==''?prA:''}" placeholder="reps">
              <button class="tick" onclick="tick(this)">&#10003;</button>
            </div>
            <div class="ss-row" data-pw="${pwB}" data-pr="${prB}">
              <div class="ss-row-letter">B</div>
              <input type="number" inputmode="decimal" step="0.5" min="0" class="w-input" value="${pwB!==''?pwB:''}" placeholder="kg">
              <input type="number" inputmode="numeric" min="0" class="r-input" value="${prB!==''?prB:''}" placeholder="reps">
              <button class="tick" onclick="tick(this)">&#10003;</button>
            </div>
          </div>
        </div>`;
      }).join("");

      return `<div class="ss-card" id="ex${i}">
        <div class="ss-header">
          <span class="ss-badge ex-drag">SS</span>
          <div class="ss-names">
            <div class="ss-ex-label">
              <span class="ss-ex-letter">A</span>
              <span class="ss-ex-name">${esc(e.exA.n)}</span>
              <span class="ss-scheme">×${esc(e.exA.r)}</span>
            </div>
            <div class="ss-ex-label">
              <span class="ss-ex-letter">B</span>
              <span class="ss-ex-name">${esc(e.exB.n)}</span>
              <span class="ss-scheme">×${esc(e.exB.r)}</span>
            </div>
          </div>
          <span class="ss-sets-label">${e.s} set${e.s!==1?"s":""}</span>
        </div>
        ${prevHtml}
        <div class="ss-sets" id="sets${i}">${setPairs}</div>
      </div>`;
    }

    const prev = last && last.ex.find(le=>le.n===e.n);
    const priorBest = allTimeBest(e.n);
    const prevHtml = priorBest ? `&#127942; PR: <b>${priorBest.weight}kg×${priorBest.reps}</b>` : "";
    const rows = Array.from({length:e.s},(_,si)=>{
      const resumeSet = resumeBlock && resumeBlock[si];
      const pw = resumeSet ? resumeSet.w : (prev&&prev.sets[si] ? prev.sets[si].w : "");
      const pr = resumeSet ? resumeSet.r : (prev&&prev.sets[si] ? prev.sets[si].r : "");
      const pt = resumeSet ? (resumeSet.type||"") : (prev&&prev.sets[si] ? (prev.sets[si].type||"") : "");
      return makeSetRow(si,pw,pr,pt);
    }).join("");
    const swapBtn = `<button class="ex-swap-btn" onclick="swapSessionExercise(${i})" aria-label="Swap exercise"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></svg></button>`;
    return `<div class="ex" id="ex${i}">
      <div class="ex-head"><div class="ex-name"><span class="ex-num ex-drag">${i+1}</span>${esc(e.n)}</div><div style="display:flex;align-items:center;gap:8px"><div class="scheme">${e.s} &times; ${esc(e.r)}</div>${swapBtn}</div></div>
      ${e.note ? `<div class="ex-note">${esc(e.note)}</div>` : ""}
      ${prevHtml ? `<div class="prev">${prevHtml}</div>` : ""}
      <div class="sets" id="sets${i}">${rows}</div>
      <button class="addset-btn" onclick="addSet(${i},event)">+ Add set</button>
    </div>`;
  }).join("");

  const footer = last
    ? `<div class="last-updated">Last workout: <b>${fmtDate(last.date)}</b> &middot; ${timeAgo(last.date)}</div>`
    : `<div class="last-updated">No previous workout logged for this session yet</div>`;

  const addExBtn = `<button class="add-mid-session-btn" onclick="showAddExerciseToSession()">+ Add exercise</button>`;

  // Compact iOS nav bar: Back, the session name with its running clock, and
  // Start (before you begin) or Finish (once started) on the right.
  const navRight = sessionState.started
    ? `<button class="session-finish-btn" onclick="saveSession(${jsArg(sessionState.id)})">Finish</button>`
    : `<button class="start-session-btn" onclick="startActiveSession()">Start</button>`;
  const navSub = sessionState.started
    ? `<div class="sn-sub" id="sessionTimer">0:00</div>`
    : `<div class="sn-sub">${esc(displayFocus)}</div>`;
  const sessionNav = `<div class="topbar session-nav">
      <button class="back" onclick="handleSessionBack()"><svg width="12" height="20" viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2L2 10l8 8"/></svg>Back</button>
      <div class="sn-title"><div class="sn-name">${esc(displayName)}</div>${navSub}</div>
      <div class="sn-right">${navRight}</div>
    </div>`;

  // Rest panel fixed to the bottom: countdown (tap to stop), 60s/90s/2m, progress.
  const bottomBar = sessionState.started
    ? `<div class="rest-panel">
        <div class="rest-panel-row">
          <button class="rest-display" id="restDisplay" onclick="cancelRest()" aria-label="Rest timer (tap to stop)">Rest</button>
          <div class="seg rest-seg" role="group" aria-label="Start a rest">
            <button class="rest-chip" data-sec="60" onclick="startRest(60)">60s</button>
            <button class="rest-chip" data-sec="90" onclick="startRest(90)">90s</button>
            <button class="rest-chip" data-sec="120" onclick="startRest(120)">2m</button>
          </div>
        </div>
        <div class="rest-track"><div class="rest-fill" id="restFill"></div></div>
      </div>
      <div class="rest-panel-spacer"></div>`
    : "";

  const blocksHtml = workingEx.length
    ? blocks
    : `<div class="chart-empty">No exercises added yet &mdash; tap "Add Exercise" below to get started.</div>`;

  app.innerHTML = `
    ${sessionNav}
    ${blocksHtml}
    ${addExBtn}
    ${footer}
    ${bottomBar}`;
  applyDoneFlags(resumeSetsData);
  window.scrollTo(0,0);
}

function applyDoneFlags(data){
  if(!data || !sessionState) return;
  sessionState.workingEx.forEach((e,i)=>{
    const c = $("sets"+i), blk = data[i];
    if(!c || !blk) return;
    if(e.superset){
      [...c.querySelectorAll(".ss-set-pair")].forEach((pair,si)=>{
        const rows = [...pair.querySelectorAll(".ss-row")];
        [["A",0],["B",1]].forEach(([k,ri])=>{
          if(blk[k] && blk[k][si] && blk[k][si].d && rows[ri]) rows[ri].querySelector(".tick")?.classList.add("on");
        });
      });
    } else {
      [...c.children].forEach((row,si)=>{
        if(blk[si] && blk[si].d) row.querySelector(".tick")?.classList.add("on");
      });
    }
    checkDone($("ex"+i));
  });
}
