function serializeSessionSets(){
  // Captures exactly what's currently typed into the DOM, per exercise block.
  const setsData = [];
  sessionState.workingEx.forEach((e,i)=>{
    const c = $("sets"+i);
    if(!c){ setsData.push(null); return; }
    if(e.superset){
      const A=[], B=[];
      [...c.querySelectorAll(".ss-set-pair")].forEach(pair=>{
        const rows = [...pair.querySelectorAll(".ss-row")];
        const rowA=rows[0], rowB=rows[1];
        A.push(rowA ? {w:rowA.querySelector(".w-input").value.trim(), r:rowA.querySelector(".r-input").value.trim(), d:rowA.querySelector(".tick")?.classList.contains("on")?1:0} : {w:"",r:""});
        B.push(rowB ? {w:rowB.querySelector(".w-input").value.trim(), r:rowB.querySelector(".r-input").value.trim(), d:rowB.querySelector(".tick")?.classList.contains("on")?1:0} : {w:"",r:""});
      });
      setsData.push({A,B});
    } else {
      const sets = [...c.children].map(row=>({
        w: row.querySelector(".w-input").value.trim(),
        r: row.querySelector(".r-input").value.trim(),
        type: row.querySelector(".setn")?.dataset?.type||"",
        d: row.querySelector(".tick")?.classList.contains("on")?1:0
      }));
      setsData.push(sets);
    }
  });
  return setsData;
}

// ── Auto-save: a live session survives the app being closed ──
// iOS freely kills home-screen apps in the background. Every change is written
// synchronously to localStorage (survives a kill), and mirrored to Firestore
// as a draft a few seconds later (survives a wiped device cache).
const ACTIVE_KEY = "mk1_active_session_v1";
let _autosaveOff = false, _asTimer = null, _asSyncTimer = null;
const STALE_SESSION_MS = 8*3600*1000;

function currentSetsData(){
  if(!sessionState || !sessionState.started) return null;
  const domLive = sessionState.workingEx.length===0 || $("sets0");
  if(domLive) sessionState.liveSets = serializeSessionSets();
  return sessionState.liveSets || null;
}
function scheduleAutosave(){
  if(_autosaveOff || !sessionState || !sessionState.started) return;
  clearTimeout(_asTimer);
  _asTimer = setTimeout(()=>autosaveSession(false), 300);
}
function autosaveSession(flush){
  if(_autosaveOff || !sessionState || !sessionState.started || !CURRENT_PROFILE) return;
  clearTimeout(_asTimer);
  try{
    const setsData = currentSetsData();
    localStorage.setItem(ACTIVE_KEY, JSON.stringify({
      profileId: CURRENT_PROFILE.id, id: sessionState.id,
      workingEx: sessionState.workingEx, adHocName: sessionState.adHocName||null,
      setsData, timerStart, restEndsAt: restInterval ? restEndsAt : 0, savedAt: Date.now()
    }));
  }catch(e){}
  clearTimeout(_asSyncTimer);
  _asSyncTimer = setTimeout(syncSessionDraft, flush ? 0 : 15000);
}
async function syncSessionDraft(){
  if(_autosaveOff || !sessionState || !sessionState.started) return;
  DRAFTS[sessionState.id] = {
    savedAt: new Date().toISOString(), elapsedSec: elapsedSeconds(),
    workingEx: sessionState.workingEx, adHocName: sessionState.adHocName||null,
    setsData: currentSetsData()
  };
  await saveLog();
}
function suspendAutosave(){ _autosaveOff = true; clearTimeout(_asTimer); clearTimeout(_asSyncTimer); }
function clearActiveSnapshot(){ try{ localStorage.removeItem(ACTIVE_KEY); }catch(e){} }

function restoreActiveSession(){
  if(sessionState && sessionState.started) return false;
  let snap = null;
  try{ snap = JSON.parse(localStorage.getItem(ACTIVE_KEY)||"null"); }catch(e){}
  if(!snap || !CURRENT_PROFILE || snap.profileId !== CURRENT_PROFILE.id) return false;
  const p = PLAN.find(x=>x.id===snap.id);
  if(snap.id!=="adhoc" && !p){ clearActiveSnapshot(); return false; }
  // Already logged elsewhere (e.g. saved but the clean-up didn't run)? Drop it.
  if(LOG.some(l=>l.sessionId===snap.id && new Date(l.date).getTime() >= snap.timerStart)){ clearActiveSnapshot(); return false; }
  if(Date.now() - snap.savedAt > STALE_SESSION_MS){
    // Left for hours: keep it as a normal draft rather than dropping the user into it.
    DRAFTS[snap.id] = {savedAt:new Date(snap.savedAt).toISOString(), elapsedSec:Math.max(0,Math.round((snap.savedAt-snap.timerStart)/1000)),
      workingEx:snap.workingEx, adHocName:snap.adHocName, setsData:snap.setsData};
    saveLog(); clearActiveSnapshot();
    showToast("Your unfinished session was kept as a draft \u2713");
    home();
    return false;
  }
  sessionState = {id:snap.id, started:true, workingEx:snap.workingEx,
    originalEx: snap.id==="adhoc" ? snap.workingEx : JSON.parse(JSON.stringify(p.ex)),
    adHocName:snap.adHocName||undefined, liveSets:snap.setsData};
  _autosaveOff = false;
  renderActiveSessionScreen(snap.setsData);
  startTimer(0, snap.timerStart);
  if(snap.restEndsAt && snap.restEndsAt > Date.now()) startRest(0, snap.restEndsAt);
  updateWakeLock();
  showToast("Picked up your session where you left off \u2713");
  scheduleAutosave();
  return true;
}

document.addEventListener("input", ()=>scheduleAutosave(), true);
document.addEventListener("change", ()=>scheduleAutosave(), true);
document.addEventListener("click", ()=>scheduleAutosave(), true);
document.addEventListener("touchend", ()=>scheduleAutosave(), true);
document.addEventListener("visibilitychange", ()=>{
  if(document.hidden) autosaveSession(true);
  else { tickRest(); if(typeof tickHiit === "function") tickHiit(); updateWakeLock(); }
});
window.addEventListener("pagehide", ()=>autosaveSession(true));

async function saveSessionDraft(){
  if(!sessionState) return;
  suspendAutosave();
  const setsData = currentSetsData() || serializeSessionSets();
  DRAFTS[sessionState.id] = {
    savedAt: new Date().toISOString(),
    elapsedSec: elapsedSeconds(),
    workingEx: sessionState.workingEx,
    adHocName: sessionState.adHocName || null,
    setsData
  };
  const ok = await saveLog();
  if(ok) clearActiveSnapshot();
  stopTimer(); cancelRest();
  sessionState = null;
  updateWakeLock();
  showToast(ok ? "Draft saved \u2014 resume any time \u2713" : "Couldn't save draft \u2014 check your connection");
  home();
}

async function cancelActiveSession(){
  suspendAutosave();
  clearActiveSnapshot();
  if(sessionState && DRAFTS[sessionState.id]){
    delete DRAFTS[sessionState.id];
    await saveLog();
  }
  stopTimer(); cancelRest();
  sessionState = null;
  updateWakeLock();
  home();
}

// ── Set-type system (Warm-up / Drop Set / Failure) ────────
const SET_TYPE_META = {
  normal:  {label:"Normal",   badge:"S#", dataType:"",        cls:"stp-normal"},
  warmup:  {label:"Warm-up",  badge:"W",  dataType:"warmup",  cls:"stp-warmup"},
  dropset: {label:"Drop Set", badge:"D",  dataType:"dropset", cls:"stp-dropset"},
  failure: {label:"Failure",  badge:"F",  dataType:"failure", cls:"stp-failure"},
};
let _activeSetTypeRow = null;

function openSetTypePopup(setn){
  closeSetTypePopup();
  _activeSetTypeRow = setn;
  const popup = document.createElement("div");
  popup.className = "set-type-popup";
  popup.innerHTML = Object.entries(SET_TYPE_META).map(([key,m])=>
    `<button onmousedown="applySetType(event,'${key}')"><span class="stp-badge ${m.cls}">${m.badge}</span>${m.label}</button>`
  ).join("");
  setn.appendChild(popup);
}

function applySetType(e, type){
  e.preventDefault(); e.stopPropagation();
  const setn = _activeSetTypeRow;
  if(!setn) return;
  const m = SET_TYPE_META[type];
  if(type==="normal"){
    // Restore the S# count from the row's position in the sets container
    const row = setn.closest(".setrow");
    const setsEl = row && row.parentElement;
    const idx = setsEl ? [...setsEl.children].indexOf(row) : 0;
    setn.textContent = "S"+(idx+1);
  } else {
    setn.textContent = m.badge;
  }
  setn.dataset.type = m.dataType;
  closeSetTypePopup();
}

function closeSetTypePopup(){
  document.querySelectorAll(".set-type-popup").forEach(p=>p.remove());
  _activeSetTypeRow = null;
}


function makeSetRow(si, pw, pr, type){
  const badge = type||"";
  const label = badge==="warmup"?"W" : badge==="dropset"?"D" : badge==="failure"?"F" : "S"+(si+1);
  return `<div class="setrow" data-pw="${pw}" data-pr="${pr}">
    <div class="setn" data-type="${badge}" onclick="openSetTypePopup(this)">${label}</div>
    <div class="field">
      <input type="number" inputmode="decimal" step="0.5" min="0" class="w-input" value="${pw!==''?pw:''}" placeholder="kg" oninput="updateSetIndicator(this)">
      <span class="trend-ind"></span>
    </div>
    <div class="field">
      <input type="number" inputmode="numeric" min="0" class="r-input" value="${pr!==''?pr:''}" placeholder="reps" oninput="updateSetIndicator(this)">
      <span class="trend-ind"></span>
    </div>
    <button class="tick" onclick="tick(this)">&#10003;</button>
    <button class="remove-set" onclick="removeSet(this)" aria-label="Remove set">&times;</button>
  </div>`;
}
// ── Reorder exercises by dragging the exercise number ─────
// Same gesture as sets: press the number (or the SS badge on a superset) and
// drag. Cards shrink to their headers while dragging; on release the session
// is redrawn in the new order with everything typed so far kept.
let _exDrag = null;
const _isExCard = el => !!(el && el.id && /^ex\d+$/.test(el.id) && (el.classList.contains("ex") || el.classList.contains("ss-card")));
document.addEventListener("pointerdown", e=>{
  if(e.button !== undefined && e.button !== 0) return;
  const handle = e.target.closest(".ex-drag");
  if(!handle || !sessionState) return;
  const card = handle.closest(".ex, .ss-card");
  if(!_isExCard(card)) return;
  _exDrag = {card, handle, startY:e.clientY, lastY:e.clientY, pointerId:e.pointerId, active:false, shift:0, scrollStart:window.scrollY};
});
document.addEventListener("pointermove", e=>{
  const d = _exDrag;
  if(!d || e.pointerId !== d.pointerId) return;
  d.lastY = e.clientY;
  if(!d.active){
    if(Math.abs(e.clientY - d.startY) < 8) return;
    const cards = [...app.children].filter(_isExCard);
    if(cards.length < 2){ _exDrag = null; return; }
    d.active = true;
    try{ d.handle.setPointerCapture(e.pointerId); }catch(err){}
    if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
    closeSetTypePopup();
    // Collapse the cards, then shift so the dragged header stays under the finger.
    // Scroll so the shrunken list stays on screen with the dragged header
    // still under the finger (rather than a big transform that pushes the
    // other cards off the top of the screen).
    const before = d.handle.getBoundingClientRect().top;
    app.classList.add("ex-reordering");
    d.card.classList.add("ex-dragging");
    window.scrollBy(0, d.handle.getBoundingClientRect().top - before);
    d.startY = e.clientY;
    d.scrollStart = window.scrollY;
    d.shift = d.handle.getBoundingClientRect().top - before;
    _exDragAutoScroll();
  }
  e.preventDefault();
  _exDragStep();
}, {passive:false});
// Near the top or bottom edge, keep scrolling while the finger is held there.
function _exDragAutoScroll(){
  const d = _exDrag;
  if(!d || !d.active) return;
  const edge = 70, vh = window.innerHeight;
  let v = 0;
  if(d.lastY < edge) v = -Math.ceil((edge - d.lastY)/6);
  else if(d.lastY > vh - edge) v = Math.ceil((d.lastY - (vh - edge))/6);
  if(v){ const y = window.scrollY; window.scrollBy(0, v); if(window.scrollY !== y) _exDragStep(); }
  requestAnimationFrame(_exDragAutoScroll);
}
function _exDragStep(){
  const d = _exDrag;
  if(!d || !d.active) return;
  const dy = (d.lastY - d.startY) + (window.scrollY - d.scrollStart);
  const rect = d.card.getBoundingClientRect();
  const centre = rect.top + rect.height/2;
  const prev = d.card.previousElementSibling, next = d.card.nextElementSibling;
  const beforeTop = d.card.offsetTop;
  if(_isExCard(next) && centre > next.getBoundingClientRect().top + next.offsetHeight/2){
    app.insertBefore(next, d.card);
  } else if(_isExCard(prev) && centre < prev.getBoundingClientRect().top + prev.offsetHeight/2){
    app.insertBefore(d.card, prev);
  }
  d.shift += d.card.offsetTop - beforeTop;
  d.card.style.transform = `translateY(${dy - d.shift}px)`;
}
function _endExDrag(e){
  const d = _exDrag;
  if(!d || (e && e.pointerId !== d.pointerId)) return;
  _exDrag = null;
  if(!d.active) return;
  d.card.style.transform = "";
  d.card.classList.remove("ex-dragging");
  // New order = the old indices in their new DOM order.
  const order = [...app.children].filter(_isExCard).map(el=>parseInt(el.id.slice(2),10));
  const changed = order.some((oldIdx,newIdx)=>oldIdx!==newIdx);
  // Capture typed values by their OLD index before anything is redrawn.
  const data = serializeSessionSets();
  app.classList.remove("ex-reordering");
  const swallow = ev=>{ ev.stopPropagation(); ev.preventDefault(); };
  window.addEventListener("click", swallow, {capture:true, once:true});
  setTimeout(()=>window.removeEventListener("click", swallow, {capture:true}), 100);
  if(!changed || !sessionState) return;
  sessionState.workingEx = order.map(i=>sessionState.workingEx[i]);
  const reordered = order.map(i=>data[i]);
  sessionState.liveSets = reordered;
  const scrollY = window.scrollY;
  renderActiveSessionScreen(reordered);
  window.scrollTo(0, scrollY);
  if(typeof scheduleAutosave === "function") scheduleAutosave();
}
document.addEventListener("pointerup", _endExDrag);
document.addEventListener("pointercancel", _endExDrag);

// ── Reorder sets by dragging the set number ───────────────
// Press on S1/S2/W/D/F and drag up or down (finger or mouse). A tap with no
// movement still opens the set-type menu, because dragging only starts once
// the pointer has moved a few pixels.
let _setDrag = null;
function _setDragTarget(e){
  if(e.target.closest(".set-type-popup")) return null;
  const handle = e.target.closest(".setn");
  if(!handle) return null;
  const row = handle.closest(".setrow");
  if(!row || !row.parentElement || !row.parentElement.classList.contains("sets")) return null;
  return {handle, row};
}
document.addEventListener("pointerdown", e=>{
  if(e.button !== undefined && e.button !== 0) return;
  const t = _setDragTarget(e);
  if(!t) return;
  _setDrag = {row:t.row, handle:t.handle, list:t.row.parentElement, startY:e.clientY, pointerId:e.pointerId, active:false, shift:0};
});
document.addEventListener("pointermove", e=>{
  const d = _setDrag;
  if(!d || e.pointerId !== d.pointerId) return;
  const dy = e.clientY - d.startY;
  if(!d.active){
    if(Math.abs(dy) < 8) return;
    if(d.list.children.length < 2){ _setDrag = null; return; }
    d.active = true;
    closeSetTypePopup();
    try{ d.handle.setPointerCapture(e.pointerId); }catch(err){}
    d.row.classList.add("set-dragging");
    d.list.classList.add("sets-reordering");
    if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
  }
  e.preventDefault();
  // Follow the pointer, and swap with a neighbour once we pass its middle.
  const rowRect = d.row.getBoundingClientRect();
  const centre = rowRect.top + rowRect.height/2;
  const prev = d.row.previousElementSibling, next = d.row.nextElementSibling;
  const before = d.row.offsetTop;
  if(next && centre > next.getBoundingClientRect().top + next.offsetHeight/2){
    d.list.insertBefore(next, d.row);
  } else if(prev && centre < prev.getBoundingClientRect().top + prev.offsetHeight/2){
    d.list.insertBefore(d.row, prev);
  }
  d.shift += d.row.offsetTop - before;
  d.row.style.transform = `translateY(${dy - d.shift}px)`;
}, {passive:false});
function _endSetDrag(e){
  const d = _setDrag;
  if(!d || (e && e.pointerId !== d.pointerId)) return;
  _setDrag = null;
  if(!d.active) return; // a plain tap: the click handler opens the set-type menu
  d.row.classList.remove("set-dragging");
  d.row.classList.add("set-settling");
  d.row.style.transform = "";
  setTimeout(()=>d.row.classList.remove("set-settling"), 160);
  d.list.classList.remove("sets-reordering");
  renumber(d.list);
  checkDone(d.row.closest(".ex"));
  // The click that follows a drag must not open the set-type menu.
  const swallow = ev=>{ ev.stopPropagation(); ev.preventDefault(); };
  window.addEventListener("click", swallow, {capture:true, once:true});
  setTimeout(()=>window.removeEventListener("click", swallow, {capture:true}), 100);
  if(typeof scheduleAutosave === "function") scheduleAutosave();
}
document.addEventListener("pointerup", _endSetDrag);
document.addEventListener("pointercancel", _endSetDrag);

function renumber(setsEl){ [...setsEl.children].forEach((row,idx)=>{ const setn=row.querySelector(".setn"); if(setn&&!setn.dataset.type) setn.textContent="S"+(idx+1); }); }

// Shared set formatter for history/reports — shows W/D/F badge inline
function fmtSet(s){
  const tag = s.type==="warmup" ? `<span class="set-type-tag warmup">W</span>` :
              s.type==="dropset" ? `<span class="set-type-tag dropset">D</span>` :
              s.type==="failure" ? `<span class="set-type-tag failure">F</span>` : "";
  return `${tag}${esc(s.w===0?0:(s.w||"?"))}kg×${esc(s.r===0?0:(s.r||"?"))}`;
}
function fmtSetPlain(s){
  const prefix = s.type==="warmup"?"[W] " : s.type==="dropset"?"[D] " : s.type==="failure"?"[F] " : "";
  return `${prefix}${s.w||"?"}kg×${s.r||"?"}`;
}

function updateSetIndicator(inputEl){
  const row = inputEl.closest(".setrow");
  const indicator = inputEl.parentElement.querySelector(".trend-ind");
  if(!row || !indicator) return;
  const isWeight = inputEl.classList.contains("w-input");
  const prevRaw = isWeight ? row.dataset.pw : row.dataset.pr;
  const prev = prevRaw!=="" ? parseFloat(prevRaw) : null;
  const curRaw = inputEl.value.trim();
  const cur = curRaw!=="" ? parseFloat(curRaw) : null;
  if(prev===null || cur===null || isNaN(prev) || isNaN(cur)){
    indicator.className = "trend-ind";
    indicator.innerHTML = "";
    return;
  }
  if(cur>prev){ indicator.className="trend-ind up"; indicator.innerHTML="&#9650;"; }
  else if(cur<prev){ indicator.className="trend-ind down"; indicator.innerHTML="&#9660;"; }
  else { indicator.className="trend-ind same"; indicator.innerHTML="&#8212;"; }
}

function tick(btn){
  const row = btn.closest(".setrow, .ss-row");
  const w = row.querySelector(".w-input"), r = row.querySelector(".r-input");
  const pw = row.dataset.pw, pr = row.dataset.pr;
  if(!btn.classList.contains("on")){
    if(!w.value && pw!=="") w.value = pw;
    if(!r.value && pr!=="") r.value = pr;
    btn.classList.add("on");
  } else btn.classList.remove("on");
  updateSetIndicator(w);
  updateSetIndicator(r);
  checkDone(btn.closest(".ex"));
}
function checkDone(exEl){
  if(!exEl) return;
  const ticks = exEl.querySelectorAll(".tick"), on = exEl.querySelectorAll(".tick.on");
  exEl.classList.toggle("done", ticks.length>0 && ticks.length===on.length);
}
function addSet(ei, e){

function removeSet(btn){

async function saveSession(id){
  id = (sessionState && sessionState.id) || id;
  const workingEx = (sessionState && sessionState.workingEx) || ((PLAN.find(x=>x.id===id)||{}).ex) || [];
  const ex = [];
  workingEx.forEach((e,i)=>{
    const c = $("sets"+i);
    if(!c) return;
    if(e.superset){
      // Each ss-set-pair contains two ss-rows (A and B) — collect them separately
      const setsA=[], setsB=[];
      [...c.querySelectorAll(".ss-set-pair")].forEach(pair=>{
        const rows = [...pair.querySelectorAll(".ss-row")];
        const rowA = rows[0], rowB = rows[1];
        if(rowA){
          const w=rowA.querySelector(".w-input").value.trim();
          const r=rowA.querySelector(".r-input").value.trim();
          if(w||r) setsA.push({w:w?parseFloat(w):"", r:r?parseInt(r):""});
        }
        if(rowB){
          const w=rowB.querySelector(".w-input").value.trim();
          const r=rowB.querySelector(".r-input").value.trim();
          if(w||r) setsB.push({w:w?parseFloat(w):"", r:r?parseInt(r):""});
        }
      });
      if(setsA.length) ex.push({n:e.exA.n, sets:setsA, supersetGroup:i});
      if(setsB.length) ex.push({n:e.exB.n, sets:setsB, supersetGroup:i});
    } else {
      const sets=[];
      [...c.children].forEach(row=>{
        const w=row.querySelector(".w-input").value.trim();
        const r=row.querySelector(".r-input").value.trim();
        if(w||r){
          const type = row.querySelector(".setn")?.dataset?.type||"";
          const entry = {w:w?parseFloat(w):"", r:r?parseInt(r):""};
          if(type) entry.type = type;
          sets.push(entry);
        }
      });
      if(sets.length) ex.push({n:e.n, sets});
    }
  });

  if(!ex.length){ showToast("Log at least one set first", false); return; }

  // Spot new personal records before this session is added to history
  const prHits = [];
  ex.forEach(e=>{
    const priorBest = allTimeBest(e.n);
    let sessionMax = null;
    e.sets.forEach(s=>{
      const w = parseFloat(s.w);
      if(isNaN(w)) return;
      if(!sessionMax || w>sessionMax) sessionMax = w;
    });
    if(sessionMax!==null && (!priorBest || sessionMax>priorBest.weight)){
      prHits.push(`${e.n.split("(")[0].trim()} ${sessionMax}kg`);
    }
  });

  const duration = elapsedMinutes();
  const isAdHocSession = id === "adhoc";
  const logEntry = {sessionId:id, date:new Date().toISOString(), duration, ex};
  if(isAdHocSession) logEntry.adHocName = (sessionState && sessionState.adHocName) || "Freestyle Session";
  LOG.push(logEntry);
  const templateChanged = (sessionState && !isAdHocSession) ? sessionTemplateChanged() : false;
  const workingExSnapshot = workingEx;
  suspendAutosave();
  const prevDraft = DRAFTS[id];
  if(DRAFTS[id]) delete DRAFTS[id]; // finishing supersedes any saved draft for this session
  const ok = await saveLog();
  if(!ok){
    // Stay on the session so nothing typed is lost; the user can retry.
    LOG.pop();
    if(prevDraft) DRAFTS[id] = prevDraft;
    _autosaveOff = false;
    scheduleAutosave();
    showToast("Couldn't save \u2014 check your connection and tap Save again", false);
    return;
  }
  clearActiveSnapshot();
  stopTimer();
  cancelRest();
  sessionState = null;
  updateWakeLock();
  if(templateChanged){
    showTemplateChangePrompt(ex, prHits, id, workingExSnapshot);
  } else {
    if(prHits.length){
      showToast(`\u{1F3C6} New PR: ${prHits.slice(0,2).join(", ")}${prHits.length>2?` +${prHits.length-2} more`:""}`);
    } else {
      showToast("Session saved \u2713");
    }
    setTimeout(()=>showPostSessionSummary(ex, prHits, id, workingExSnapshot), 1200);
  }
}

async function deduplicateHiitLog(){
  // For each HIIT class on each calendar day, keep only the longest entry.
  // Runs once at boot to fix any duplicates already in Firestore, and is a
  // no-op when there's nothing to clean up so it costs nothing on repeat logins.
  const hiitEntries = LOG.filter(s=>s.hiit);
  if(hiitEntries.length < 2) return;
  const seen = {};
  const toRemove = new Set();
  hiitEntries.forEach(s=>{
    const key = `${s.sessionId}::${localDayKey(s.date)}`;
    const idx = LOG.indexOf(s);
    if(seen[key]===undefined){
      seen[key] = idx;
    } else {
      const prevIdx = seen[key];
      if((s.duration||0) > (LOG[prevIdx].duration||0)){
        toRemove.add(prevIdx);
        seen[key] = idx;
      } else {
        toRemove.add(idx);
      }
    }
  });
  if(toRemove.size===0) return;
  LOG = LOG.filter((_,i)=>!toRemove.has(i));
  await saveLog();
}

// ── Body weight tracker ──────────────────────────────────
function sortedWeights(){ return [...WEIGHTS].sort((a,b)=>a.date.localeCompare(b.date)); }

function changeSince(sorted, days, key="weight"){
  if(sorted.length<2) return null;
  const last = sorted[sorted.length-1];
  const cutoff = new Date(last.date).getTime() - days*86400000;
  let ref = null;
  for(const w of sorted){ if(new Date(w.date).getTime() <= cutoff) ref = w; }
  if(!ref || ref===last) return null;
  return last[key] - ref[key];
}

function deltaHtml(delta, decimals=1){
  if(delta===null || delta===undefined) return `<span class="value flat">&mdash;</span>`;
  const cls = delta>0.05 ? "up" : delta<-0.05 ? "down" : "flat";
  const arrow = delta>0.05 ? "&#9650;" : delta<-0.05 ? "&#9660;" : "&#8212;";
  return `<span class="value ${cls}">${arrow} ${Math.abs(delta).toFixed(decimals)}kg</span>`;
}

// ── Bar charts (dashboard) ────────────────────────────────
function buildBarChartSVG(items, opts={}){
  const color = opts.color || "var(--accent)";
  const labelEvery = opts.labelEvery || 1;
  const unit = opts.unit || "";
  const showValues = opts.showValues!==false;
  const W=560, H=190, padL=26, padR=10, padT=18, padB=30;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const maxV = Math.max(...items.map(i=>i.value), 1);
  const n = items.length;
  const slot = plotW/n;
  const barW = Math.max(slot*0.55, 3);
  const bars = items.map((it,i)=>{
    const h = (it.value/maxV)*plotH;
    const x = padL + slot*i + (slot-barW)/2;
    const y = padT + plotH - h;
    const showLabel = (i % labelEvery === 0) || i===n-1;
    const valueLabel = (showValues && it.value>0) ? `<text x="${(x+barW/2).toFixed(1)}" y="${(y-4).toFixed(1)}" fill="var(--mute)" font-size="9" text-anchor="middle">${it.value}${unit}</text>` : "";
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(h,1).toFixed(1)}" rx="3" fill="${color}"/>
      ${valueLabel}
      ${showLabel ? `<text x="${(x+barW/2).toFixed(1)}" y="${H-8}" fill="var(--mute)" font-size="9" text-anchor="middle">${it.label}</text>` : ""}`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    <line x1="${padL}" y1="${padT+plotH}" x2="${W-padR}" y2="${padT+plotH}" stroke="var(--line)" stroke-width="1"/>
    ${bars}
  </svg>`;
}

function buildStackedBarChartSVG(items, seriesKeys, colors, opts={}){
  const showValues = opts.showValues!==false;
  const labelEvery = opts.labelEvery || 1;
  const W=560, H=190, padL=26, padR=10, padT=18, padB=30;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const totals = items.map(it => seriesKeys.reduce((s,k)=>s+(it[k]||0),0));
  const maxV = Math.max(...totals, 1);
  const n = items.length;
  const slot = plotW/n;
  const barW = Math.max(slot*0.55, 3);
  const bars = items.map((it,i)=>{
    const x = padL + slot*i + (slot-barW)/2;
    let cursorY = padT + plotH;
    let segs = "";
    seriesKeys.forEach(k=>{
      const v = it[k]||0;
      const h = (v/maxV)*plotH;
      cursorY -= h;
      if(v>0) segs += `<rect x="${x.toFixed(1)}" y="${cursorY.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(h,1).toFixed(1)}" fill="${colors[k]}"/>`;
    });
    const total = totals[i];
    const totalLabel = (showValues && total>0) ? `<text x="${(x+barW/2).toFixed(1)}" y="${(cursorY-4).toFixed(1)}" fill="var(--mute)" font-size="9" text-anchor="middle">${total}</text>` : "";
    const showLabel = (i % labelEvery === 0) || i===n-1;
    return `${segs}${totalLabel}${showLabel ? `<text x="${(x+barW/2).toFixed(1)}" y="${H-8}" fill="var(--mute)" font-size="9" text-anchor="middle">${it.label}</text>` : ""}`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    <line x1="${padL}" y1="${padT+plotH}" x2="${W-padR}" y2="${padT+plotH}" stroke="var(--line)" stroke-width="1"/>
    ${bars}
  </svg>`;
}

function dailyVisitBuckets(log, daysBack){
  const today = new Date(); today.setHours(0,0,0,0);
  const days = [];
  for(let i=daysBack-1;i>=0;i--){
    const d = new Date(today); d.setDate(today.getDate()-i);
    const key = localDayKey(d);
    const inDay = log.filter(s=>localDayKey(s.date)===key);
    const label = daysBack<=7 ? d.toLocaleDateString("en-GB",{weekday:"short"}) : String(d.getDate());
    days.push({label, value:inDay.length, gym:inDay.filter(s=>!s.hiit).length, hiit:inDay.filter(s=>s.hiit).length});
  }
  return days;
}

function dailyMinutesBuckets(log, daysBack){
  const today = new Date(); today.setHours(0,0,0,0);
  const days = [];
  for(let i=daysBack-1;i>=0;i--){
    const d = new Date(today); d.setDate(today.getDate()-i);
    const key = localDayKey(d);
    const mins = log.filter(s=>localDayKey(s.date)===key).reduce((sum,s)=>sum+(s.duration||0),0);
    const label = daysBack<=7 ? d.toLocaleDateString("en-GB",{weekday:"short"}) : String(d.getDate());
    days.push({label, value:mins});
  }
  return days;
}

function buildTrendChartSVG(pairs){
  if(pairs.length<2){
    return `<div class="chart-empty">Log at least two entries to see a trend line here.</div>`;
  }
  const W=560, H=200, padL=38, padR=12, padT=16, padB=24;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const times = pairs.map(w=>new Date(w.date).getTime());
  const vals = pairs.map(w=>w.value);
  const minT=Math.min(...times), maxT=Math.max(...times);
  const minW=Math.min(...vals), maxW=Math.max(...vals);
  const range = Math.max(maxW-minW, 0.5);
  const pad = Math.max(range*0.2, 0.5);
  const loY = minW-pad, hiY = maxW+pad;
  const x = t => padL + (maxT>minT ? (t-minT)/(maxT-minT) : 0.5) * plotW;
  const y = v => padT + plotH - (v-loY)/(hiY-loY) * plotH;
  const pts = pairs.map((w,i)=>[x(times[i]), y(w.value)]);
  const lineD = pts.map((p,i)=>(i===0?"M":"L")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  const areaD = lineD + ` L${pts[pts.length-1][0].toFixed(1)},${(padT+plotH).toFixed(1)} L${pts[0][0].toFixed(1)},${(padT+plotH).toFixed(1)} Z`;
  const circles = pts.map((p,i)=>{
    const last = i===pts.length-1;
    return `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${last?5:3}" fill="${last?"var(--accent)":"var(--good)"}" style="stroke:var(--paper)" stroke-width="1.5"/>`;
  }).join("");
  const gridY = [loY, (loY+hiY)/2, hiY];
  const gridlines = gridY.map(v=>{
    const yy=y(v).toFixed(1);
    return `<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="var(--line)" stroke-width="1"/>
      <text x="${padL-6}" y="${yy}" fill="var(--mute)" font-size="10" text-anchor="end" dominant-baseline="middle">${v.toFixed(1)}</text>`;
  }).join("");
  const firstLabel = fmtDate(pairs[0].date);
  const lastLabel = fmtDate(pairs[pairs.length-1].date);
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    ${gridlines}
    <path d="${areaD}" fill="var(--accent)" opacity="0.12"/>
    <path d="${lineD}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${circles}
    <text x="${padL}" y="${H-6}" fill="var(--mute)" font-size="10">${firstLabel}</text>
    <text x="${W-padR}" y="${H-6}" fill="var(--mute)" font-size="10" text-anchor="end">${lastLabel}</text>
  </svg>`;
}

// ── Cardio tracker (distance + time, separate from gym sessions) ──
function showCardioTracker(editIdx){
  stopTimer();
  const sorted = [...CARDIO_LOG].sort((a,b)=>a.date.localeCompare(b.date));

  // Use localDayKey comparisons (YYYY-MM-DD) rather than full ISO timestamps —
  // cardio entries are stored with a noon local-time stamp which in BST becomes
  // 11:00 UTC, so a moment-based `< now` check excludes same-day entries logged
  // before noon if the user is checking earlier in the morning.
  const todayKey = localDayKey(new Date());
  const weekStartDate = new Date();
  const dow = weekStartDate.getDay();
  weekStartDate.setDate(weekStartDate.getDate() - (dow===0?6:dow-1));
  const weekStartKey = localDayKey(weekStartDate);

  const thisWeek = CARDIO_LOG.filter(c=>{
    const dk = localDayKey(c.date);
    return dk >= weekStartKey && dk <= todayKey;
  });
  const weekDist = thisWeek.reduce((s,c)=>s+(c.distance||0),0);
  const weekDur = thisWeek.reduce((s,c)=>s+(c.duration||0),0);

  const statRow = `<div class="stat-row">
    <div class="stat-card"><div class="label">Distance this week</div><div class="value">${weekDist.toFixed(1)}km</div></div>
    <div class="stat-card"><div class="label">Time this week</div><div class="value">${fmtDuration(weekDur)}</div></div>
  </div>`;

  const distancePairs = sorted.filter(c=>c.distance>0).map(c=>({date:c.date, value:c.distance}));
  const chart = `<div class="section-label">Distance trend</div><div class="chart-card">${buildTrendChartSVG(distancePairs)}</div>`;

  const today = localDayKey(new Date());
  const options = CARDIO_ACTIVITIES.map(a=>`<option value="${a}">${a}</option>`).join("");

  const prefill = editing ? CARDIO_LOG[editIdx] : null;
  const prefillDate = prefill ? localDayKey(prefill.date) : today;
  const prefillOptions = CARDIO_ACTIVITIES.map(a=>`<option value="${a}" ${prefill&&prefill.activity===a?"selected":""}>${a}</option>`).join("");

  const form = `<div class="cardio-form" ${editing?'style="border-color:var(--accent2)"':""}>
    ${editing?`<div class="section-label" style="margin:0 0 8px;color:var(--accent2)">Editing \u2014 make changes then tap Update</div>`:""}
    <select id="cActivity">${editing?prefillOptions:options}</select>
    <div class="cardio-form-row">
      <input type="date" id="cDate" value="${editing?prefillDate:today}">
      <input type="number" inputmode="decimal" step="0.1" min="0" id="cDistance" placeholder="km" value="${prefill&&prefill.distance?prefill.distance:""}">
      <input type="number" inputmode="numeric" min="0" id="cDuration" placeholder="mins" value="${prefill&&prefill.duration?prefill.duration:""}">
    </div>
    ${editing
      ? `<button onclick="updateCardioEntry(${editIdx})">Update</button>
         <button class="auth-link-btn" style="margin-top:4px" onclick="showCardioTracker()">Cancel</button>`
      : `<button onclick="saveCardioEntry()">Log cardio</button>`
    }
  </div>`;

  const rows = CARDIO_LOG.map((c,i)=>({...c,_i:i})).sort((a,b)=>b.date.localeCompare(a.date)).map(c=>`
    <div class="wrow${c._i===editIdx?" wrow-editing":""}">
      <div class="wd">${esc(c.activity)} &middot; ${fmtDate(c.date)}</div>
      <div class="wright">
        <span class="wv" style="font-size:13px">${c.distance>0?`${c.distance}km &middot; `:""}${fmtDuration(c.duration)}</span>
        <button class="wedit" onclick="showCardioTracker(${c._i})" aria-label="Edit">&#9998;</button>
        <button class="wdel" onclick="deleteCardioEntry(${c._i})" aria-label="Delete">&times;</button>
      </div>
    </div>`).join("");

  const historyBlock = CARDIO_LOG.length
    ? `<div class="section-label">History</div><div class="hday">${rows}</div>`
    : `<div class="chart-empty">No cardio logged yet &mdash; add your first session below.</div>`;

  app.innerHTML = `
    ${topbar({back:`home()`, title:`Cardio`, sub:esc(CURRENT_PROFILE.name)})}
    ${statRow}
    ${chart}
    ${form}
    ${historyBlock}
  `;
  if(editing) document.querySelector(".cardio-form")?.scrollIntoView({behavior:"smooth",block:"center"});
  else window.scrollTo(0,0);
}

async function saveCardioEntry(){
  const activity = $("cActivity").value;
  const dateVal = $("cDate").value;
  const distance = parseFloat($("cDistance").value);
  const duration = parseInt($("cDuration").value);
  if(!dateVal){ showToast("Pick a date", false); return; }
  if(!distance && !duration){ showToast("Enter a distance or a time", false); return; }
  const iso = new Date(dateVal+"T12:00:00").toISOString();
  CARDIO_LOG.push({date: iso, activity, distance: distance||0, duration: duration||0});
  const ok = await saveLog();
  showToast(ok ? "Cardio logged \u2713" : "Couldn't save \u2014 check your connection");
  showCardioTracker();
}

async function updateCardioEntry(idx){
  const activity = $("cActivity").value;
  const dateVal = $("cDate").value;
  const distance = parseFloat($("cDistance").value);
  const duration = parseInt($("cDuration").value);
  if(!dateVal){ showToast("Pick a date", false); return; }
  if(!distance && !duration){ showToast("Enter a distance or a time", false); return; }
  const iso = new Date(dateVal+"T12:00:00").toISOString();
  CARDIO_LOG[idx] = {date: iso, activity, distance: distance||0, duration: duration||0};
  const ok = await saveLog();
  showToast(ok ? "Updated \u2713" : "Couldn't save \u2014 check your connection");
  showCardioTracker();
}

async function deleteCardioEntry(idx){
  if(!confirm("Remove this cardio entry?")) return;
  CARDIO_LOG.splice(idx,1);
  await saveLog();
  showCardioTracker();
}

function sessionLabelForLog(entries, planToUse){
  if(!entries || !entries.length) return null;
  const e = entries[0];
  if(e.hiit) return e.hiitName || "HIIT";
  if(e.adHocName) return e.adHocName;
  const planEntry = (planToUse||PLAN).find(p=>p.id===e.sessionId);
  return planEntry ? planEntry.name : (e.sessionId || "Session");
}

function trainedDaysLabelMap(log, planToUse){
  const byDay = {};
  log.forEach(e=>{
    const key = localDayKey(e.date);
    if(!byDay[key]) byDay[key] = [];
    byDay[key].push(e);
  });
  const labelMap = {};
  Object.keys(byDay).forEach(key=>{ labelMap[key] = sessionLabelForLog(byDay[key], planToUse); });
  return labelMap;
}

// Just the weekday header + day grid for one month - the month name and
// navigation arrows are rendered by whatever calls this, since this is now
// used for a single paged month rather than a stacked multi-month view.
function buildMonthCalendarHTML(year, month, labelMap){
  const firstDay = new Date(year, month, 1);
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const startDow = (firstDay.getDay()+6)%7; // Monday-start week

  let cells = "";
  for(let i=0;i<startDow;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const key = localDayKey(new Date(year, month, d));
    const label = labelMap[key];
    cells += label
      ? `<div class="cal-cell trained"><div class="cal-daynum">${d}</div><div class="cal-label">${esc(label)}</div></div>`
      : `<div class="cal-cell"><div class="cal-daynum">${d}</div></div>`;
  }
  return `<div class="cal-weekdays"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div>
    <div class="cal-grid">${cells}</div>`;
}

let activityMonthOffset = 0; // 0 = current month, 1 = one month back, etc.

function setActivityMonthOffset(delta){

// ── Weekly check-in ───────────────────────────────────────
// Week key is the Monday date string (YYYY-MM-DD) — unambiguous and timezone-safe.
// The check-in is "due" on Sunday but can be submitted or viewed any time after.
function weekKeyForDate(d){
  const dt = new Date(d);
  const day = dt.getDay(); // 0=Sun
  const diffToMon = day===0 ? -6 : 1-day;
  const mon = new Date(dt);
  mon.setDate(dt.getDate() + diffToMon);
  return localDayKey(mon);
}
function weekSunday(weekKey){
  // Given a Monday-date week key, return the following Sunday
  const mon = new Date(weekKey + "T12:00:00");
  const sun = new Date(mon);
  sun.setDate(mon.getDate() + 6);
  return sun;
}
function currentWeekKey(){
  return weekKeyForDate(new Date());
}
function pendingCheckInWeekKey(){
  // Returns the most recent week key that has ended and has no submitted
  // check-in. Only looks back to the user's first ever session — no point
  // flagging empty weeks before they started using the app.
  const today = new Date();
  const firstSessionDate = LOG.length
    ? new Date(LOG.reduce((e,s)=>s.date<e?s.date:e, LOG[0].date))
    : today;
  const firstWeekKey = weekKeyForDate(firstSessionDate);
  for(let weeksBack = 1; weeksBack <= 52; weeksBack++){
    const candidate = new Date(today);
    candidate.setDate(today.getDate() - weeksBack * 7);
    const wk = weekKeyForDate(candidate);
    if(wk < firstWeekKey) break; // don't go back before first session
    const sun = weekSunday(wk); // pass string, not Date
    if(sun > today) continue;
    if(!CHECKINS.some(c=>c.weekKey===wk && c.submitted)) return wk;
  }
  return null;
}
function isCheckInDue(){
  return !!pendingCheckInWeekKey();
}

const TRAINER_FEEDBACK_EMOJIS = ["👍","💪","🔥","❤️","👏","🙌"];
const TRAINER_FEEDBACK_PHRASES = [
  "Great week!","Keep it up!","Impressive consistency",
  "You're making progress","Let's push harder next week",
  "Rest up and recover","Brilliant effort"
];

const VOLUME_COMPARISONS = [
  {label:"African elephants",    emoji:"🐘", kg:6000},
  {label:"Mini Coopers",         emoji:"🚗", kg:1160},
  {label:"Smart cars",           emoji:"🚙", kg:750},
  {label:"grizzly bears",        emoji:"🐻", kg:270},
  {label:"male lions",           emoji:"🦁", kg:190},
  {label:"washing machines",     emoji:"🫧", kg:75},
  {label:"golden retrievers",    emoji:"🐕", kg:32},
  {label:"grand pianos",         emoji:"🎹", kg:480},
  {label:"vending machines",     emoji:"📦", kg:340},
  {label:"Fiat 500s",            emoji:"🏎️", kg:1020},
];

function volumeComparison(volumeKg, weekKey){
  if(volumeKg < 10) return null;
  // Seed from weekKey so the same week always shows the same comparison,
  // but different weeks rotate through the list naturally
  const seed = weekKey.replace(/-/g,"").split("").reduce((s,c)=>s+c.charCodeAt(0),0);
  const good = VOLUME_COMPARISONS.filter(c=>{ const n=volumeKg/c.kg; return n>=0.3&&n<=25; });
  const pool = good.length ? good : VOLUME_COMPARISONS;
  const pick = pool[seed % pool.length];
  const n = volumeKg / pick.kg;
  const nStr = n < 2 ? n.toFixed(1) : Math.round(n).toString();
  return `${pick.emoji} That's the weight of ${nStr} ${pick.label}`;
}

function weekPBs(log, weekKey){
  const monDate = new Date(weekKey + "T00:00:00");
  const sunDate = new Date(weekKey + "T00:00:00");
  sunDate.setDate(sunDate.getDate()+6); sunDate.setHours(23,59,59,999);
  const wLog = log.filter(s=>{ const d=new Date(s.date); return d>=monDate&&d<=sunDate; });
  const beforeLog = log.filter(s=>new Date(s.date)<monDate);
  const priorBest = {};
  beforeLog.forEach(session=>{
    (session.ex||[]).forEach(e=>{
      (e.sets||[]).forEach(s=>{
        const w=parseFloat(s.w)||0, r=parseInt(s.r)||0;
        if(w>0 && (!priorBest[e.n]||w>priorBest[e.n].w||(w===priorBest[e.n].w&&r>priorBest[e.n].r)))
          priorBest[e.n]={w,r};
      });
    });
  });
  const weekBest = {};
  wLog.forEach(session=>{
    (session.ex||[]).forEach(e=>{
      (e.sets||[]).forEach(s=>{
        const w=parseFloat(s.w)||0, r=parseInt(s.r)||0;
        if(w>0 && (!weekBest[e.n]||w>weekBest[e.n].w||(w===weekBest[e.n].w&&r>weekBest[e.n].r)))
          weekBest[e.n]={w,r};
      });
    });
  });
  return Object.entries(weekBest)
    .filter(([name,best])=>!priorBest[name]||best.w>priorBest[name].w||(best.w===priorBest[name].w&&best.r>priorBest[name].r))
    .map(([name,best])=>({name:name.replace(/\(.*?\)/g,"").trim(), weight:best.w, reps:best.r}));
}

function compileWeekMetrics(log, weights, cardioLog, weekKey){
  const monDate = new Date(weekKey + "T00:00:00");
  const sunDate = weekSunday(weekKey); // string, not Date object — weekSunday does new Date(weekKey+"T12:00:00") internally
  const sunEnd = new Date(sunDate); sunEnd.setHours(23,59,59,999);
  const wLog = log.filter(s=>{ const d=new Date(s.date); return d>=monDate && d<=sunEnd; });
  const sessions = wLog.length;
  const duration = wLog.reduce((s,e)=>s+(e.duration||0), 0);
  const volume = wLog.reduce((s,e)=>s+(e.ex||[]).reduce((s2,x)=>s2+(x.sets||[]).reduce((s3,st)=>s3+(parseFloat(st.w)||0)*(parseInt(st.r)||0),0),0), 0);
  const sets = wLog.reduce((s,e)=>s+(e.ex||[]).reduce((s2,x)=>s2+(x.sets||[]).length,0), 0);
  const muscleVols = computeMuscleVolume(wLog);
  const topMuscle = Object.entries(muscleVols).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1])[0];
  const topMuscleLabel = topMuscle ? (MUSCLE_GROUP_LABELS[topMuscle[0]]||topMuscle[0]) : null;
  const wWeights = weights.filter(w=>{ const d=new Date(w.date); return d>=monDate && d<=sunEnd; });
  const lastWeight = wWeights.length ? wWeights[wWeights.length-1].w : null;
  const wCardio = cardioLog.filter(c=>{ const d=new Date(c.date); return d>=monDate && d<=sunEnd; });
  const cardioDist = wCardio.reduce((s,c)=>s+(c.distance||0), 0);
  const cardioDur = wCardio.reduce((s,c)=>s+(c.duration||0), 0);
  const streak = weekStreakFor(log);
  const pbs = weekPBs(log, weekKey);
  const volComparison = volumeComparison(Math.round(volume), weekKey);
  return {sessions, duration, volume: Math.round(volume), sets, topMuscleLabel,
          lastWeight, cardioDist, cardioDur, streak, pbs, volComparison, weekKey,
          monday: monDate.toLocaleDateString("en-GB",{day:"numeric",month:"short"}),
          sunday: sunDate.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})};
}

function showWeeklyCheckin(weekKey){
  stopTimer();
  weekKey = weekKey || pendingCheckInWeekKey() || currentWeekKey();

  const today = new Date();
  // Only show weeks from the user's first ever logged session — no point
  // reviewing empty weeks before they started using the app.
  const firstSessionDate = LOG.length
    ? new Date(LOG.reduce((e,s)=>s.date<e?s.date:e, LOG[0].date))
    : today;
  const firstWeekKey = weekKeyForDate(firstSessionDate);
  const weekOptions = [];
  for(let i=1; i<=52; i++){
    const d = new Date(today);
    d.setDate(today.getDate() - i*7);
    const wk = weekKeyForDate(d);
    if(wk < firstWeekKey) break;
    const sun = weekSunday(wk);
    if(sun > today) continue;
    const mon = new Date(wk + "T12:00:00");
    const submitted = CHECKINS.some(c=>c.weekKey===wk&&c.submitted);
    const label = `${mon.toLocaleDateString("en-GB",{day:"numeric",month:"short"})} – ${sun.toLocaleDateString("en-GB",{day:"numeric",month:"short"})}${submitted?" ✓":""}`;
    weekOptions.push({wk, label, submitted});
  }
  const pickerOptions = weekOptions.map(o=>
    `<option value="${o.wk}" ${o.wk===weekKey?"selected":""}>${o.label}</option>`
  ).join("");

  const existing = CHECKINS.find(c=>c.weekKey===weekKey);
  const m = compileWeekMetrics(LOG, WEIGHTS, CARDIO_LOG, weekKey);
  const lastWeightSuggestion = WEIGHTS.length
    ? [...WEIGHTS].sort((a,b)=>a.date.localeCompare(b.date)).slice(-1)[0].w
    : "";

  const pickerHtml = `<div class="editor-field" style="margin-bottom:16px">
    <label>Week</label>
    <select onchange="showWeeklyCheckin(this.value)" style="width:100%;background:var(--chip);border:1.5px solid var(--line);color:var(--text);border-radius:12px;padding:11px;font-size:14px;font-weight:600">
      ${pickerOptions}
    </select>
  </div>`;

  if(existing && existing.submitted){
    renderCheckinView(existing, m, false, pickerHtml);
  } else {
    app.innerHTML = `
      ${topbar({back:`home()`, title:`Weekly Check-In`, sub:`${m.monday} &ndash; ${m.sunday}`})}
      ${pickerHtml}
      <div class="checkin-banner">
        <div class="checkin-banner-title">Week in review</div>
        <div class="checkin-banner-sub">Here's what your data says — add your weight and a note to complete this week's check-in.</div>
      </div>
      ${renderCheckInMetricSummary(m)}
      <div class="section-label" style="margin-top:20px">Body weight this week</div>
      <div class="weight-form">
        <input type="number" inputmode="decimal" step="0.1" id="ciWeight" value="${existing?.bodyWeight||lastWeightSuggestion||""}" placeholder="kg">
      </div>
      <div class="section-label">How was your week?</div>
      <textarea id="ciComment" class="checkin-textarea" maxlength="500" placeholder="How did you feel? Anything that helped or held you back this week?">${esc(existing?.comment||"")}</textarea>
      <button class="save-session-btn" onclick="submitWeeklyCheckin('${weekKey}')">Submit check-in</button>
      <button class="auth-link-btn" style="margin-top:8px" onclick="skipWeeklyCheckin('${weekKey}')">Skip this week</button>
    `;
    window.scrollTo(0,0);
  }
}

function setFeedbackPhrase(idx){
  pendingFeedbackPhrase = TRAINER_FEEDBACK_PHRASES[idx]||"";
  document.querySelectorAll(".feedback-phrase-btn").forEach((b,i)=>b.classList.toggle("active", i===idx));
}

async function submitTrainerFeedback(){
  const form = document.getElementById("feedbackForm");
  if(!form){ showToast("Something went wrong", false); return; }
  if(!pendingFeedbackEmoji && !pendingFeedbackPhrase){ showToast("Pick an emoji or a phrase first", false); return; }
  const weekKey = form.dataset.checkinKey;
  const clientId = form.dataset.clientId;
  if(!clientId){ showToast("Couldn't identify the client", false); return; }

  try{
    const snap = await getDoc(doc(db, "trackers", `${TRACKER_ID}-${clientId}`));
    const clientData = snap.exists() ? snap.data() : {};
    const checkIns = clientData.checkIns || [];
    const ci = checkIns.find(c=>c.weekKey===weekKey);
    if(!ci){ showToast("Check-in not found", false); return; }
    ci.trainerFeedback = {
      emoji: pendingFeedbackEmoji,
      phrase: pendingFeedbackPhrase,
      trainerId: CURRENT_PROFILE.id,
      trainerName: CURRENT_PROFILE.name,
      sentAt: new Date().toISOString()
    };
    if(!(await commitWrite(setDoc(doc(db, "trackers", `${TRACKER_ID}-${clientId}`), {checkIns}, {merge:true})))) throw new Error("write failed");
    showToast("Feedback sent \u2713");
    pendingFeedbackEmoji = ""; pendingFeedbackPhrase = "";
    showClientCheckins(clientId);
  }catch(e){
    showToast("Couldn't send feedback \u2014 check your connection", false);
  }
}

async function skipWeeklyCheckin(weekKey){
  // Mark as submitted with skipped:true so it stops appearing as overdue.
  // The week stays accessible in history via the picker but won't nag again.
  const existing = CHECKINS.findIndex(c=>c.weekKey===weekKey);
  const ci = {weekKey, submitted:true, skipped:true, submittedAt:new Date().toISOString()};
  if(existing>=0) CHECKINS[existing]={...CHECKINS[existing],...ci};
  else CHECKINS.push(ci);
  await saveLog();
  home();
}

async function submitWeeklyCheckin(weekKey){
  const weight = parseFloat(document.getElementById("ciWeight")?.value)||null;
  const comment = (document.getElementById("ciComment")?.value||"").trim();
  const existing = CHECKINS.findIndex(c=>c.weekKey===weekKey);
  const ci = {
    weekKey,
    submitted: true,
    submittedAt: new Date().toISOString(),
    bodyWeight: weight,
    comment,
  };
  if(existing>=0) CHECKINS[existing] = {...CHECKINS[existing], ...ci};
  else CHECKINS.push(ci);
  if(weight) WEIGHTS.push({date: new Date().toISOString(), w: weight});
  const ok = await saveLog();
  showToast(ok ? "Check-in submitted \u2713" : "Couldn't save \u2014 check your connection");
  if(ok) showCheckinHistory();
}

function showCheckinHistory(){
  stopTimer();
  const sorted = [...CHECKINS].filter(c=>c.submitted).sort((a,b)=>b.weekKey.localeCompare(a.weekKey));
  const rows = sorted.map(ci=>{
    const m = compileWeekMetrics(LOG, WEIGHTS, CARDIO_LOG, ci.weekKey);
    const feedbackBadge = ci.trainerFeedback
      ? `<span style="font-size:16px">${ci.trainerFeedback.emoji||""}</span>`
      : "";
    return `<div class="sess-row" style="cursor:pointer" onclick="viewCheckinEntry('${ci.weekKey}')">
      <div class="sr-info">
        <b>${m.monday} &ndash; ${m.sunday}</b>
        <span>${m.sessions} session${m.sessions!==1?"s":""} &middot; ${fmtDuration(m.duration)} &middot; ${fmtVolume(m.volume)}</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        ${feedbackBadge}
        <div style="color:var(--mute);font-size:18px">&rsaquo;</div>
      </div>
    </div>`;
  }).join("");
  app.innerHTML = `
    ${topbar({back:`home()`, title:`Check-In History`, sub:esc(CURRENT_PROFILE.name)})}
    ${rows || '<div class="chart-empty">No check-ins submitted yet.</div>'}
  `;
  window.scrollTo(0,0);
}

function viewCheckinEntry(weekKey){
  const ci = CHECKINS.find(c=>c.weekKey===weekKey);
  if(!ci) return;
  const m = compileWeekMetrics(LOG, WEIGHTS, CARDIO_LOG, weekKey);
  renderCheckinView(ci, m, false);
}

async function viewClientCheckinEntry(clientId, weekKey){
  let clientLog=[], clientWeights=[], clientCardio=[], clientCheckins=[];
  try{
    const snap = await getDoc(doc(db, "trackers", `${TRACKER_ID}-${clientId}`));
    if(snap.exists()){
      clientLog = snap.data().log||[];
      clientWeights = snap.data().weights||[];
      clientCardio = snap.data().cardioLog||[];
      clientCheckins = snap.data().checkIns||[];
    }
  }catch(e){}
  pendingFeedbackEmoji = ""; pendingFeedbackPhrase = "";
  const ci = clientCheckins.find(c=>c.weekKey===weekKey);
  if(!ci){ showToast("Couldn't load that check-in", false); return; }

    pendingFeedbackPhrase = ci.trainerFeedback.phrase||"";

async function renderMeasurementsScreen(){
  stopTimer();
  const data = await fetchPersonData(viewingPersonId);
  const person = viewingPersonLabel();
  const m = currentMeasureMetric;
  const segButtons = MEASURE_METRICS.map(mm=>
    `<button class="${mm.id===m?"active":""}" onclick="setMeasureMetric('${mm.id}')">${mm.label}</button>`
  ).join("");

  const sorted = [...data.measurements].filter(e=>e[m]!=null).sort((a,b)=>a.date.localeCompare(b.date));
  const last = sorted[sorted.length-1];
  const weekChange = changeSince(sorted, 7, m);
  const monthChange = changeSince(sorted, 30, m);

  const statRow = `<div class="stat-row">
    <div class="stat-card"><div class="label">Current</div><div class="value">${last?last[m]+"cm":"&mdash;"}</div></div>
    <div class="stat-card"><div class="label">7 days</div>${deltaHtml(weekChange)}</div>
    <div class="stat-card"><div class="label">30 days</div>${deltaHtml(monthChange)}</div>
  </div>`;

  const chart = `<div class="chart-card">${buildTrendChartSVG(sorted.map(e=>({date:e.date, value:e[m]})))}</div>`;

  let form = "";
  if(viewingIsSelf){
    const today = localDayKey(new Date());
    const existingToday = data.measurements.find(e=>e.date.slice(0,10)===today) || {};
    form = `<div class="measure-form">
      <div class="mrow"><input type="date" id="mDate" value="${today}" style="flex:1"></div>
      <div class="mrow"><label>Waist</label><input type="number" inputmode="decimal" step="0.1" min="0" id="mWaist" placeholder="cm" value="${existingToday.waist??""}"></div>
      <div class="mrow"><label>Chest</label><input type="number" inputmode="decimal" step="0.1" min="0" id="mChest" placeholder="cm" value="${existingToday.chest??""}"></div>
      <div class="mrow"><label>Arms</label><input type="number" inputmode="decimal" step="0.1" min="0" id="mArms" placeholder="cm" value="${existingToday.arms??""}"></div>
      <button class="save-measure" onclick="saveMeasurementEntry()">Save measurements</button>
    </div>`;
  }

  const allSorted = [...data.measurements].sort((a,b)=>b.date.localeCompare(a.date));
  const rows = allSorted.map(e=>{
    const idx = data.measurements.indexOf(e);
    const parts = MEASURE_METRICS.filter(mm=>e[mm.id]!=null).map(mm=>`${mm.label} ${e[mm.id]}cm`).join(" &nbsp;\u00b7&nbsp; ");
    const delBtn = viewingIsSelf ? `<button class="wdel" onclick="deleteMeasurementEntry(${idx})" aria-label="Delete">&times;</button>` : "";
    return `<div class="wrow">
      <div class="wd">${fmtDate(e.date)}</div>
      <div class="wright"><span class="wv" style="font-size:12px;font-weight:700">${parts||"&mdash;"}</span>${delBtn}</div>
    </div>`;
  }).join("");
  const historyBlock = allSorted.length
    ? `<div class="section-label">History</div><div class="hday">${rows}</div>`
    : `<div class="chart-empty">No entries yet${viewingIsSelf?" \u2014 log your first measurements below.":"."}</div>`;

  app.innerHTML = `
    ${topbar({back:viewingBackTarget, title:`Body Measurements`, sub:esc(person.name)})}
    <div class="seg">${segButtons}</div>
    ${statRow}
    ${chart}
    ${form}
    ${historyBlock}
  `;
  window.scrollTo(0,0);
}

async function saveMeasurementEntry(){
  const dateVal = $("mDate").value;
  const waist = parseFloat($("mWaist").value);
  const chest = parseFloat($("mChest").value);
  const arms = parseFloat($("mArms").value);
  if(!dateVal || (isNaN(waist) && isNaN(chest) && isNaN(arms))){
    showToast("Enter a date and at least one measurement", false);
    return;
  }
  const iso = new Date(dateVal+"T12:00:00").toISOString();
  const dayStr = iso.slice(0,10);
  let entry = MEASUREMENTS.find(e=>e.date.slice(0,10)===dayStr);
  if(!entry){ entry = {date: iso}; MEASUREMENTS.push(entry); }
  if(!isNaN(waist)) entry.waist = Math.round(waist*10)/10;
  if(!isNaN(chest)) entry.chest = Math.round(chest*10)/10;
  if(!isNaN(arms)) entry.arms = Math.round(arms*10)/10;
  const ok = await saveLog();
  showToast(ok ? "Measurements saved \u2713" : "Couldn't save \u2014 check your connection");
  renderMeasurementsScreen();
}

async function deleteMeasurementEntry(idx){
  if(!confirm("Remove this measurement entry?")) return;
  MEASUREMENTS.splice(idx,1);
  await saveLog();
  renderMeasurementsScreen();
}

// ── Session builder (one editor for your own plan AND a client's plan) ──
// builderClientId is null when you're editing your own sessions, or a
// client's profile id when a trainer/admin is building on their behalf. The
// client's plan is saved on its own (only the `plan` field of their document),
// so a trainer's edits can never land in anyone else's data.
let draftSession = null;       // {id, name, focus, ex:[{n,s,r,note} | {superset,s,exA,exB}]}
let builderClientId = null;    // null = your own plan
let trainerClientId = null;    // the client whose sessions are open
let trainerClientPlan = [];    // that client's plan, loaded from their document

function builderPlan(){ return builderClientId ? trainerClientPlan : PLAN; }
function setBuilderPlan(arr){ if(builderClientId) trainerClientPlan = arr; else PLAN = arr; }
// A client's plan is only valid while that client's sessions are loaded.
function builderReady(){ return !builderClientId || builderClientId === trainerClientId; }
async function saveBuilderPlan(){ return builderClientId ? saveTrainerClientPlan() : saveLog(); }
function showBuilderList(){ if(builderClientId) renderTrainerClientSessions(); else showSettings(); }

function slugify(name){
  return name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"") || "session";
}
function uniqueSessionId(name){
  const base = slugify(name);
  const plan = builderPlan();
  let id = base, n = 2;
  while(plan.some(p=>p.id===id)){ id = `${base}-${n}`; n++; }
  return id;
}

async function moveSessionInPlan(id, dir){
  const idx = PLAN.findIndex(p=>p.id===id);
  if(idx<0) return;
  const newIdx = idx + dir;
  if(newIdx<0 || newIdx>=PLAN.length) return;
  [PLAN[idx], PLAN[newIdx]] = [PLAN[newIdx], PLAN[idx]];
  await saveLog();
  showSettings();
}

function exercisePickerOptions(){
  const grouped = EXERCISE_LIBRARY.map(cat=>
    `<optgroup label="${cat.cat}">${cat.items.map(n=>`<option value="${n.replace(/"/g,"&quot;")}">${n}</option>`).join("")}</optgroup>`

function toggleCustomExerciseInput(selectId, inputId){
  const sel = $(selectId), inp = $(inputId);
  if(!sel || !inp) return;
  const isCustom = sel.value === "__custom__";
  inp.style.display = isCustom ? "block" : "none";
  if(isCustom) inp.focus();
}

// clientId: omit (or null) for your own plan; a client's id for theirs.
function openSessionEditor(id, clientId){
  stopTimer();
  builderClientId = clientId || null;
  if(!builderReady()){ manageClientSessions(builderClientId); return; }
  if(id){
    const existing = builderPlan().find(p=>p.id===id);
    if(!existing){ showBuilderList(); return; }
    draftSession = JSON.parse(JSON.stringify(existing));
  } else {
    draftSession = {id:null, name:"", focus:"", ex:[]};
  }
  renderSessionEditor();
}

function renderSessionEditor(){
  const last = draftSession.ex.length-1;
  const reorder = i=>`<div class="dx-reorder">
          <button onclick="moveDraftExercise(${i},-1)" ${i===0?"disabled":""} aria-label="Move up">&#9650;</button>
          <button onclick="moveDraftExercise(${i},1)" ${i===last?"disabled":""} aria-label="Move down">&#9660;</button>
        </div>`;
  const exRows = draftSession.ex.map((e,i)=>{
    if(e.superset){
      return `<div class="ss-draft">
        <div class="ss-draft-header">
          ${reorder(i)}
          <span class="ss-badge">SS</span>
          <span style="flex:1;font-size:11px;color:var(--mute);font-weight:700">Superset</span>
          <button class="dx-remove" onclick="removeDraftExercise(${i})" aria-label="Remove superset">&times;</button>
        </div>
        <div class="ss-draft-ex">
          <span class="ss-draft-ex-letter">A</span>
          <span class="ss-draft-ex-name">${esc(e.exA.n)}</span>
          <input class="dx-reps" type="text" value="${esc(e.exA.r)}" oninput="setDraftSupersetReps(${i},'A',this.value)" style="width:64px">
        </div>
        <div class="ss-draft-ex">
          <span class="ss-draft-ex-letter">B</span>
          <span class="ss-draft-ex-name">${esc(e.exB.n)}</span>
          <input class="dx-reps" type="text" value="${esc(e.exB.r)}" oninput="setDraftSupersetReps(${i},'B',this.value)" style="width:64px">
        </div>
        <div class="ss-draft-sets-row">
          <span class="ss-draft-sets-label">Sets:</span>
          <input class="dx-sets" type="text" inputmode="numeric" value="${esc(e.s)}" oninput="setDraftExSets(${i},this.value)">
        </div>
      </div>`;
    }
    return `
    <div class="draft-ex">
      <div class="dx-main-row">
        ${reorder(i)}
        <div class="dx-name">${esc(e.n)}</div>
        <input class="dx-sets" type="text" inputmode="numeric" value="${esc(e.s)}" oninput="setDraftExSets(${i},this.value)">
        <input class="dx-reps" type="text" value="${esc(e.r)}" oninput="setDraftExReps(${i},this.value)">
        <button class="dx-remove" onclick="removeDraftExercise(${i})" aria-label="Remove">&times;</button>
      </div>
      <div class="dx-note-row"><input type="text" value="${esc(e.note||"")}" placeholder="Add a note for this exercise (optional)" oninput="setDraftExNote(${i},this.value)"></div>
    </div>`}).join("");

  const isNew = !draftSession.id;
  const deleteBtn = !isNew
    ? `<button class="delete-session-btn" onclick="deleteSessionFromPlan(${jsArg(draftSession.id)}, ${builderClientId?jsArg(builderClientId):"null"})">Delete</button>`
    : "";
  const client = builderClientId ? (PEOPLE.find(p=>p.id===builderClientId) || {name:builderClientId}) : null;
  const subtitle = client ? `For ${esc(client.name)}` : esc(CURRENT_PROFILE.name);

  app.innerHTML = `
    ${topbar({back:`showBuilderList()`, title:isNew?"New Session":"Edit Session", sub:subtitle})}
    <div class="editor-field">
      <label>Session name</label>
      <input type="text" value="${esc(draftSession.name)}" placeholder="e.g. Push Day" oninput="setDraftName(this.value)">
    </div>
    <div class="editor-field">
      <label>Focus tagline</label>
      <input type="text" value="${esc(draftSession.focus)}" placeholder="e.g. Chest &amp; triceps" oninput="setDraftFocus(this.value)">
    </div>
    <div class="section-label">Exercises</div>
    ${exRows || '<div class="chart-empty">No exercises added yet.</div>'}
    <div class="add-ex-row">
      <select id="exercisePicker" onchange="toggleCustomExerciseInput('exercisePicker','customExerciseName')">${exercisePickerOptions()}</select>
      <button onclick="addDraftExercise()">Add</button>
    </div>
    <input type="text" id="customExerciseName" class="custom-ex-input" style="display:none" placeholder="Type the exercise name" maxlength="60">
    <div class="add-ex-row" style="margin-top:-4px">
      <select id="ssPickerA" onchange="toggleCustomExerciseInput('ssPickerA','ssCustomA')">${exercisePickerOptions()}</select>
      <span style="flex-shrink:0;font-size:11px;font-weight:700;color:var(--mute)">+</span>
      <select id="ssPickerB" onchange="toggleCustomExerciseInput('ssPickerB','ssCustomB')">${exercisePickerOptions()}</select>
      <button class="ss-add-btn" onclick="addDraftSuperset()">SS</button>
    </div>
    <input type="text" id="ssCustomA" class="custom-ex-input" style="display:none" placeholder="Superset exercise A" maxlength="60">

    <div class="editor-actions">
      <button class="save-session-btn" onclick="saveDraftSession()">Save session</button>
      ${deleteBtn}
    </div>

// Setters routed through real functions rather than direct variable access in
// inline attributes, since inline handlers run in global scope and can't see
// this module's "let draftSession" closure variable.
function setDraftName(v){ draftSession.name = v; }
function setDraftFocus(v){ draftSession.focus = v; }
function setDraftExSets(i,v){ draftSession.ex[i].s = parseInt(v)||1; }
function setDraftExReps(i,v){ draftSession.ex[i].r = v; }
function setDraftExNote(i,v){ draftSession.ex[i].note = v; }
function setDraftSupersetReps(i,side,v){
  if(side==="A") draftSession.ex[i].exA.r = v;
  else draftSession.ex[i].exB.r = v;
}

function addDraftSuperset(){
  const selA = $("ssPickerA"), selB = $("ssPickerB");
  const customA = $("ssCustomA"), customB = $("ssCustomB");
  let nameA = selA ? selA.value : "";
  let nameB = selB ? selB.value : "";
  if(nameA==="__custom__") nameA = (customA?.value||"").trim();
  if(nameB==="__custom__") nameB = (customB?.value||"").trim();
  if(!nameA || !nameB){ showToast("Choose both exercises for the superset", false); return; }
  if(nameA===nameB){ showToast("The two exercises in a superset should be different", false); return; }
  draftSession.ex.push({superset:true, s:3, exA:{n:nameA, r:"10-12"}, exB:{n:nameB, r:"10-12"}});
  renderSessionEditor();
}

function addDraftExercise(){
  const sel = $("exercisePicker");
  if(!sel || !sel.value) return;
  let name = sel.value;
  if(name==="__custom__"){
    name = (($("customExerciseName")?.value)||"").trim();
    if(!name){ showToast("Type a name for the exercise", false); return; }
  }
  draftSession.ex.push({n:name, s:3, r:"10-12", note:""});

// ── HIIT class runner (countdown engine) ──────────────────
let hiitState = null;
let hiitInterval = null;
// The class runs on the clock: phaseEndsAt is when the current work/rest
// phase ends, and elapsed time is accMs plus time since runStartedAt. If the
// phone sleeps, the next tick catches up through every phase that has passed.
const HIIT_KEY = "mk1_active_hiit_v1";

function cancelHiit(){
  if(hiitInterval){ clearInterval(hiitInterval); hiitInterval=null; }
  if(hiitState && hiitState.running && !hiitState.done) pauseHiitClock();
  if(hiitState) hiitState.running=false;
  updateWakeLock();
}
// Back from the runner: the class is abandoned, so forget it.
function leaveHiitRunner(){
  cancelHiit();
  hiitState = null;
  clearHiitSnapshot();
  home();
}

function hiitPhaseLength(){
  const cls = hiitState.cls;
  if(hiitState.phase==="roundrest") return cls.roundRestSec;
  if(cls.format==="interval") return hiitState.phase==="work" ? cls.workSec : cls.restSec;
  if(cls.format==="amrap") return cls.capMin*60;
  return cls.intervalSec;
}

function openHiitRunner(id){
  stopTimer(); cancelRest();
  const cls = HIIT_CLASSES.find(c=>c.id===id);
  if(!cls || !cls.ex.length){ showToast("Couldn't open that class", false); return; }
  hiitState = {
    cls,
    phase: "work",
    exIndex: 0,
    round: 1,
    remaining: cls.format==="interval" ? cls.workSec : cls.format==="amrap" ? cls.capMin*60 : cls.intervalSec,
    elapsedSec: 0,
    running: false,
    roundsCompleted: 0,
    done: false,
    accMs: 0, runStartedAt: 0, phaseEndsAt: 0, pausedLeftMs: 0
  };
  renderHiitRunner();
}

function cueBeep(){
  if(hiitState && hiitState.catchingUp) return; // no burst of beeps after time away
  buzz(150);
  playBeep();
}

function advanceHiitExercise(){
  cueBeep();
  hiitState.exIndex++;
  if(hiitState.exIndex>=hiitState.cls.ex.length){
    hiitState.exIndex=0;
    hiitState.round++;
    if(hiitState.round>hiitState.cls.rounds){ finishHiit(); return; }
    if(hiitState.cls.roundRestEnabled && hiitState.cls.roundRestSec>0){
      hiitState.phase="roundrest";
      hiitState.remaining=hiitState.cls.roundRestSec;
      return;
    }
  }
  hiitState.phase="work";
  hiitState.remaining = hiitState.cls.format==="interval" ? hiitState.cls.workSec : hiitState.cls.intervalSec;
}

function handlePhaseEnd(){
  const cls = hiitState.cls;
  if(cls.format==="amrap"){ finishHiit(); return; }
  if(hiitState.phase==="roundrest"){
    cueBeep();
    hiitState.phase="work";
    hiitState.remaining = cls.format==="interval" ? cls.workSec : cls.intervalSec;
    return;
  }
  if(cls.format==="interval"){
    if(hiitState.phase==="work"){
      cueBeep();
      hiitState.phase="rest";
      hiitState.remaining=cls.restSec;
      if(cls.restSec<=0) advanceHiitExercise();
    } else {
      advanceHiitExercise();
    }
  } else {
    advanceHiitExercise();
  }
}

function hiitElapsedMs(at){
  const s = hiitState;
  return s.accMs + (s.running ? Math.max(0, at - s.runStartedAt) : 0);
}
function pauseHiitClock(){
  const s = hiitState, now = Date.now();
  s.accMs = hiitElapsedMs(now);
  s.pausedLeftMs = Math.max(0, s.phaseEndsAt - now);
  s.elapsedSec = Math.floor(s.accMs/1000);
}

function tickHiit(){
  const s = hiitState;
  if(!s || s.done || !s.running) return;
  const now = Date.now();
  const before = `${s.phase}|${s.exIndex}|${s.round}|${s.remaining}`;
  let guard = 0;
  // Step through every phase boundary that has passed (one, normally; many
  // if the phone was asleep).
  while(s.running && !s.done && now >= s.phaseEndsAt && guard++ < 500){
    const boundary = s.phaseEndsAt;
    s.catchingUp = (now - boundary) > 1500;
    s.elapsedSec = Math.floor(hiitElapsedMs(boundary)/1000);
    handlePhaseEnd();
    if(s.done) break;
    s.phaseEndsAt = boundary + hiitPhaseLength()*1000;
  }
  s.catchingUp = false;
  if(s.done){ renderHiitRunner(); return; }
  s.elapsedSec = Math.floor(hiitElapsedMs(now)/1000);
  s.remaining = Math.max(0, Math.ceil((s.phaseEndsAt - now)/1000));
  const after = `${s.phase}|${s.exIndex}|${s.round}|${s.remaining}`;
  if(after !== before){
    if(before.split("|").slice(0,3).join() !== after.split("|").slice(0,3).join()) saveHiitSnapshot();
    renderHiitRunner();
  }
}

function finishHiit(){
  if(hiitInterval){ clearInterval(hiitInterval); hiitInterval=null; }
  if(hiitState.running && !hiitState.catchingUp) hiitState.elapsedSec = Math.floor(hiitElapsedMs(Date.now())/1000);
  hiitState.running=false;
  hiitState.done=true;
  clearHiitSnapshot();
  updateWakeLock();
  if(!hiitState.catchingUp){ buzz([200,100,200,100,200]); playBeep(); }
  const durationMin = Math.max(1, Math.round(hiitState.elapsedSec/60));
  const sessionId = `hiit-${hiitState.cls.id}`;
  const todayKey = localDayKey(new Date());
  // If there's already an entry for this class today, only keep the longer one
  const existingIdx = LOG.findIndex(s=>s.sessionId===sessionId && localDayKey(s.date)===todayKey);
  if(existingIdx>=0){
    if(durationMin > (LOG[existingIdx].duration||0)){
      LOG[existingIdx].duration = durationMin;
    }
    // shorter or equal — discard the new one, keep the existing
  } else {
    LOG.push({sessionId, date:new Date().toISOString(), duration:durationMin, ex:[], hiit:true, hiitName:hiitState.cls.name});
  }
  saveLog().then(ok=>{ showToast(ok ? "Class complete! Logged \u2713" : "Class complete (sync failed)"); });
}

function toggleHiitTimer(){
  if(hiitState.done) return;
  const now = Date.now();
  if(hiitState.running){
    clearInterval(hiitInterval); hiitInterval=null;
    pauseHiitClock();
    hiitState.running=false;
  } else {
    hiitState.running=true;
    hiitState.runStartedAt = now;
    hiitState.phaseEndsAt = now + (hiitState.pausedLeftMs || hiitState.remaining*1000);
    hiitState.pausedLeftMs = 0;
    hiitInterval = setInterval(tickHiit, 250);
  }
  saveHiitSnapshot();
  updateWakeLock();
  renderHiitRunner();
}
function skipHiitPhase(){
  if(!hiitState || hiitState.done) return;
  handlePhaseEnd();
  if(!hiitState.done){
    const len = hiitPhaseLength()*1000;
    if(hiitState.running) hiitState.phaseEndsAt = Date.now() + len;
    else hiitState.pausedLeftMs = len;
    hiitState.remaining = hiitPhaseLength();
    saveHiitSnapshot();
  }
  renderHiitRunner();
}
function finishHiitEarly(){
  if(!confirm("Finish this class now? It'll be logged with the time you've done so far.")) return;
  finishHiit();
  renderHiitRunner();
}
function incrementAmrapRound(){
  hiitState.roundsCompleted++;
  saveHiitSnapshot();
  renderHiitRunner();
}

// Keep a running class on the phone so closing the app doesn't lose it.
function saveHiitSnapshot(){
  if(!hiitState || hiitState.done || !CURRENT_PROFILE) return;
  try{
    const {cls, catchingUp, ...rest} = hiitState;
    localStorage.setItem(HIIT_KEY, JSON.stringify({profileId:CURRENT_PROFILE.id, clsId:cls.id, savedAt:Date.now(), state:rest}));
  }catch(e){}
}
function clearHiitSnapshot(){ try{ localStorage.removeItem(HIIT_KEY); }catch(e){} }
function restoreActiveHiit(){
  if(hiitState && !hiitState.done) return false;
  let snap = null;
  try{ snap = JSON.parse(localStorage.getItem(HIIT_KEY)||"null"); }catch(e){}
  if(!snap || !CURRENT_PROFILE || snap.profileId !== CURRENT_PROFILE.id) return false;
  const cls = HIIT_CLASSES.find(c=>c.id===snap.clsId);
  if(!cls || Date.now() - snap.savedAt > 3*3600*1000){ clearHiitSnapshot(); return false; }
  hiitState = Object.assign({}, snap.state, {cls, catchingUp:false});
  if(hiitState.running){
    hiitInterval = setInterval(tickHiit, 250);
    tickHiit();
  }
  updateWakeLock();
  if(hiitState.done) return true;
  renderHiitRunner();
  showToast("Picked up your class where you left off \u2713");
  return true;
}

function renderHiitRunner(){
  const s = hiitState, cls = s.cls;

  if(s.done){
    app.innerHTML = `
      ${topbar({back:`home()`, title:esc(cls.name), sub:`Complete`})}
      <div class="streak-hero">
        <div class="num">&#10003;</div>
        <div class="lbl">Class complete &mdash; logged to your activity</div>
      </div>
      <div class="last-updated">${Math.max(1,Math.round(s.elapsedSec/60))} min &middot; ${cls.ex.length} exercises</div>
      <div class="savebar"><div class="inner"><button class="save-btn" onclick="home()">Done</button></div></div>
    `;
    return;
  }

  const exName = cls.ex[s.exIndex % cls.ex.length].n;
  let phaseLabel, phaseClass;
  if(cls.format==="amrap"){ phaseLabel="AMRAP"; phaseClass="amrap"; }
  else if(s.phase==="roundrest"){ phaseLabel="ROUND REST"; phaseClass="rest"; }
  else if(cls.format==="emom"){ phaseLabel="EMOM"; phaseClass="work"; }
  else { phaseLabel = s.phase==="work" ? "WORK" : "REST"; phaseClass = s.phase; }
  const exNameLabel = s.phase==="roundrest" ? `Up next: ${esc(exName)}` : esc(exName);

  const progressLabel = cls.format==="amrap"
    ? `Rounds completed: ${s.roundsCompleted}`
    : `Round ${Math.min(s.round,cls.rounds)} of ${cls.rounds} &middot; Exercise ${(s.exIndex%cls.ex.length)+1} of ${cls.ex.length}`;

  const exList = cls.ex.map((e,i)=>{
    const active = cls.format!=="amrap" && i===(s.exIndex%cls.ex.length);
    return `<div class="hiit-ex-row${active?" active":""}"><div class="hx-name">${i+1}. ${esc(e.n)}</div></div>`;
  }).join("");

  const amrapBtn = cls.format==="amrap"
    ? `<button class="rest-chip" style="width:100%;margin-bottom:14px" onclick="incrementAmrapRound()">+1 round (currently ${s.roundsCompleted})</button>`
    : "";

  app.innerHTML = `
    ${topbar({back:`leaveHiitRunner()`, title:esc(cls.name), sub:progressLabel})}
    <div class="hiit-timer-card ${phaseClass}">
      <div class="hiit-phase">${phaseLabel}</div>
      <div class="hiit-countdown">${fmtRest(Math.max(0,s.remaining))}</div>
      <div class="hiit-exname">${exNameLabel}</div>
    </div>
    ${amrapBtn}
    <div class="hiit-controls">
      <button class="hiit-ctrl-btn primary" onclick="toggleHiitTimer()">${s.running?"Pause":"Start"}</button>
      <button class="hiit-ctrl-btn" onclick="skipHiitPhase()">Skip</button>
      <button class="hiit-ctrl-btn" onclick="finishHiitEarly()">Finish</button>
    </div>
    <div class="section-label">Exercises</div>
    ${exList}
  `;
}

// ── Leaderboard (Ed vs Tara, consistency-based) ───────────
function startOfWeekISO(){
  const now = new Date(); const dow=(now.getDay()+6)%7;
  const d = new Date(now); d.setDate(now.getDate()-dow); d.setHours(0,0,0,0);
  return d.toISOString();
}
function startOfMonthISO(){
  const now = new Date();
  return new Date(now.getFullYear(), now.getMonth(), 1, 0,0,0,0).toISOString();
}

async function showLeaderboard(){
  stopTimer();
  app.innerHTML = `${topbar({back:`home()`, title:`Leaderboard`})}

  window.scrollTo(0,0);

  await loadPeople();
  const myLocations = CURRENT_PROFILE.locations || [];
  // Only include people who share at least one location with the current user
  // - trainers are excluded since they don't log sessions against themselves.
  const candidates = PEOPLE.filter(p=>
    p.role !== "trainer" &&
    p.locations && p.locations.some(loc=>myLocations.includes(loc))
  );
  const locationLabel = myLocations.length ? esc(myLocations.join(" & ")) : "your gym";

  const results = await Promise.all(candidates.map(async p=>{

    // their public summary (session dates only).

  const stats = results.map(r=>({
    profile:r.profile, ok:r.ok,
    week: sessionsInRange(r.log, weekStart, now),
    month: sessionsInRange(r.log, monthStart, now),
    streak: weekStreakFor(r.log),
    total: r.log.length
  }));
  stats.sort((a,b)=> b.week-a.week || b.streak-a.streak || b.total-a.total);

  const offlineNote = stats.some(s=>!s.ok)
    ? `<div class="sync-banner">Couldn't load everyone's numbers \u2014 the list below may be incomplete.</div>`
    : "";

  app.innerHTML = `

    ${offlineNote}
    ${rows || `<div class="chart-empty">No one else at ${locationLabel} yet.</div>`}

}

async function renameLocation(idx){
  const oldName = GYM_LOCATIONS[idx];
  const input = prompt(`Rename "${oldName}" to:`, oldName);
  if(input===null) return; // cancelled
  const newName = input.trim();
  if(!newName){ showToast("Location name can't be empty", false); return; }
  if(newName===oldName) return;
  if(GYM_LOCATIONS.some((l,i)=>i!==idx && l.toLowerCase()===newName.toLowerCase())){
    showToast("That location name is already in use", false);
    return;
  }

  GYM_LOCATIONS[idx] = newName;
  // Cascade the rename to everyone who had the old name - locations are
  // stored as plain strings on each person, not stable IDs, so without
  // this they'd silently lose their location association entirely.
  let affected = 0;
  PEOPLE.forEach(p=>{
    if(p.locations && p.locations.includes(oldName)){
      p.locations = p.locations.map(l=>l===oldName ? newName : l);
      affected++;
    }
  });

  await saveLocations();
  if(affected) await savePeople();
  showToast(`Renamed to "${newName}"${affected?` \u2014 updated for ${affected} ${affected===1?"person":"people"}`:""}`);
  showManageLocations();
}

async function addLocation(){
  const name = ($("newLocationName").value||"").trim();
  if(!name){ showToast("Enter a location name", false); return; }
  if(GYM_LOCATIONS.some(l=>l.toLowerCase()===name.toLowerCase())){ showToast("That location already exists", false); return; }
  GYM_LOCATIONS.push(name);
  await saveLocations();
  showToast("Location added \u2713");
  showManageLocations();
}

async function deleteLocation(idx){
  const loc = GYM_LOCATIONS[idx];
  const inUseCount = PEOPLE.filter(p=>p.locations && p.locations.includes(loc)).length;
  const msg = inUseCount
    ? `${inUseCount} ${inUseCount===1?"person is":"people are"} currently set to "${loc}". Remove it anyway? They'll keep showing it on their profile until you edit them individually, but it won't be selectable for anyone new.`
    : `Remove "${loc}"?`;
  if(!confirm(msg)) return;
  GYM_LOCATIONS.splice(idx,1);
  await saveLocations();
  showToast("Location removed");
  showManageLocations();
}
