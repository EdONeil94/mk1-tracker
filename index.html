async function toggleAdminPersonLocation(loc, checked){
  const p = PEOPLE.find(x=>x.id===editPersonId);
  if(!p) return;
  if(!p.locations) p.locations = [];
  if(p.role==="client"){
    p.locations = checked ? [loc] : [];
  } else {
    if(checked){ if(!p.locations.includes(loc)) p.locations.push(loc); }
    else{ p.locations = p.locations.filter(l=>l!==loc); }
  }
  await savePeople();
  renderEditPerson();
}

async function saveEditedPersonDetails(){
  const p = PEOPLE.find(x=>x.id===editPersonId);
  if(!p) return;
  const name = ($("editPersonName").value||"").trim();
  const email = ($("editPersonEmail").value||"").trim();
  if(!name){ showToast("Name can't be empty", false); return; }
  if(email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ showToast("Enter a valid email address", false); return; }
  p.name = name;
  if(email) p.email = email;
  const ok = await savePeople();
  if(ok && email && p.username){ await registerLoginLookup(email, p.username, p.uid); await registerUsernameLookup(p.username, email, p.uid); }
  showToast(ok ? "Saved \u2713" : "Couldn't save \u2014 check your connection");
  renderEditPerson();
}

async function approveTrainerRequest(id){
  const p = PEOPLE.find(x=>x.id===id);
  if(!p) return;
  p.role = "trainer";
  if(!p.clientIds) p.clientIds = [];
  delete p.requestedRole;
  const ok = await savePeople();
  showToast(ok ? `${p.name} is now a trainer \u2713` : "Couldn't save \u2014 check your connection");
  showAdminDashboard();

async function declineTrainerRequest(id){
  const p = PEOPLE.find(x=>x.id===id);
  if(!p) return;
  if(!confirm(`Decline ${p.name}'s trainer request? They'll stay a client.`)) return;
  delete p.requestedRole;
  if(p.locations && p.locations.length>1) p.locations = p.locations.slice(0,1);
  const ok = await savePeople();
  showToast(ok ? "Request declined" : "Couldn't save \u2014 check your connection");
  showAdminDashboard();
}

async function setPersonRole(role){
  const p = PEOPLE.find(x=>x.id===editPersonId);
  if(!p) return;
  p.role = role;
  if(role==="trainer") delete p.requestedRole;
  if(role==="trainer" && !p.clientIds) p.clientIds = [];
  if(role==="client" && p.locations && p.locations.length>1) p.locations = p.locations.slice(0,1);
  await savePeople();

async function toggleAdminClientLink(clientId, checked){

async function deletePersonFromAdmin(){
  const p = PEOPLE.find(x=>x.id===editPersonId);
  if(!p) return;
  if(!confirm(`Remove ${p.name} from the people directory?\n\nThis does NOT delete their Firebase login if one still exists (do that separately in Firebase Console \u2192 Authentication), and does NOT delete any workout history they've logged \u2014 only their entry here and their place in lists like client-linking.`)) return;
  PEOPLE = PEOPLE.filter(x=>x.id!==p.id);
  await savePeople();
  await removeFromLoginLookup(p.email);
  await removeFromUsernameLookup(p.username);
  showToast(`${p.name} removed`);
  showAdminDashboard();
}

async function saveAccountEmail(){
  const val = ($("accountEmail").value||"").trim();
  const usernameVal = ($("accountUsername").value||"").trim();
  if(!val || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val)){
    showToast("Enter a valid email address", false);
    return;
  }
  if(!usernameVal){
    showToast("Enter your username", false);
    return;
  }
  await loadPeople();
  const p = PEOPLE.find(x=>x.id===CURRENT_PROFILE.id);
  const oldUsername = p ? (p.username||"") : "";
  const usernameChanged = lkey(usernameVal) !== lkey(oldUsername);
  if(usernameChanged && !(await claimUsername(usernameVal, val))){
    showToast("That username is already taken \u2014 please choose another", false);
    return;
  }

  // Compare against the REAL registered Firebase Auth email (not the stored
  // profile field) - this one check naturally covers both a genuine new
  // email change AND the one-time migration off the old placeholder email
  // for any account that hasn't done it yet, with no special-casing needed.
  // Firebase deprecated the old instant updateEmail() in favour of this -
  // it sends a confirmation link to the new address rather than switching
  // immediately, so the actual Firebase Auth email only updates once that
  // link is clicked.
  let emailChangePending = false;
  const isGoogleUser = auth.currentUser && auth.currentUser.providerData &&
    auth.currentUser.providerData.some(p=>p.providerId==="google.com");
  if(isGoogleUser){
    // Google manages the email address for Google sign-in accounts — it can't
    // be changed here. The value is saved to the profile for display purposes
    // but the actual Google account email is not affected.
    if(auth.currentUser.email && auth.currentUser.email !== val){
      showToast("Your email is managed by Google and can\u2019t be changed here.", false);
      return;
    }
  } else if(auth.currentUser && auth.currentUser.email !== val){
    try{
      await verifyBeforeUpdateEmail(auth.currentUser, val);
      emailChangePending = true;
    }catch(e){
      let msg;
      if(e && e.code==="auth/requires-recent-login") msg = "For security, log out and back in, then try saving your email again.";
      else if(e && e.code==="auth/email-already-in-use") msg = "That email is already linked to a different account here.";
      else if(e && e.code==="auth/invalid-email") msg = "That doesn't look like a valid email address.";
      else msg = `Couldn't update your login email (${(e&&e.code)||"unknown error"}) \u2014 nothing was changed.`;
      showToast(msg, false);
      return;
    }
  }

  if(p){
    p.username = usernameVal;
    p.email = val;  // always persist to PEOPLE even if no Firebase Auth change was needed
    CURRENT_PROFILE.email = val;
    CURRENT_PROFILE.username = usernameVal;
  }
  const ok = await savePeople();
  if(ok && p){
    await registerLoginLookup(val, usernameVal);
    await registerUsernameLookup(usernameVal, val);
    if(usernameChanged && oldUsername) await removeFromUsernameLookup(oldUsername);
  }
  if(!ok){
    showToast("Couldn't save \u2014 check your connection");
  } else if(emailChangePending){
    showToast(`Saved. Check your inbox at ${val} and click the link to finish updating your login email.`);
  } else {
    showToast("Saved \u2713");
  }
}

async function toggleAccountLocation(loc, checked){

  if(!p) return;

  if(p.role==="client"){

  }
}

function processImageFile(file){
  return new Promise((resolve, reject)=>{
    if(!file.type || !file.type.startsWith("image/")){
      reject(new Error("not an image"));
      return;
    }
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const size = 200;
        const canvas = document.createElement("canvas");
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext("2d");
        const minSide = Math.min(img.width, img.height);
        const sx = (img.width-minSide)/2, sy = (img.height-minSide)/2;
        ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);
        resolve(canvas.toDataURL("image/jpeg", 0.8));
      };
      img.onerror = ()=>reject(new Error("couldn't read that image"));
      img.src = e.target.result;
    };
    reader.onerror = ()=>reject(new Error("couldn't read that file"));
    reader.readAsDataURL(file);
  });
}

async function handlePhotoFileSelected(event){
  const file = event.target.files && event.target.files[0];
  event.target.value = "";
  if(!file) return;
  if(file.size > 12*1024*1024){
    showToast("That image is too large \u2014 try a smaller one", false);
    return;
  }
  showToast("Processing photo\u2026");
  try{
    const dataUrl = await processImageFile(file);
    const p = PEOPLE.find(x=>x.id===CURRENT_PROFILE.id);
    if(p){ p.photo = dataUrl; CURRENT_PROFILE.photo = dataUrl; }
    const ok = await savePeople();
    showToast(ok ? "Photo updated \u2713" : "Couldn't save \u2014 check your connection");
    showAccountSettings();
  }catch(e){
    showToast("Couldn't process that image", false);
  }
}

// ── Muscle map ──────────────────────────────────────────────
function computeMuscleSets(logEntries){
  const totals = {};
  MUSCLE_GROUPS.forEach(g=>totals[g]=0);
  logEntries.forEach(session=>{
    (session.ex||[]).forEach(e=>{
      const group = EXERCISE_MUSCLE_MAP[e.n];
      if(group) totals[group] += (e.sets||[]).length;
    });
  });
  return totals;
}

function heatColor(sets, cap){
  if(sets<=0) return "var(--heat0)";
  const t = Math.min(sets/Math.max(cap,1), 1);
  const cold=[58,70,92], hot=[226,80,42];
  const r = Math.round(cold[0]+(hot[0]-cold[0])*t);
  const g = Math.round(cold[1]+(hot[1]-cold[1])*t);
  const b = Math.round(cold[2]+(hot[2]-cold[2])*t);
  return `rgb(${r},${g},${b})`;
}

function buildMuscleMapSVG(totals){
  const cap = Math.max(...MUSCLE_GROUPS.map(g=>totals[g]||0), 1);

  // Combine related sub-groups per visual body region
  const C = {
    upper_chest: heatColor(totals["upper_chest"]||0, cap),
    chest:       heatColor(sum("chest","upper_chest"), cap),
    shoulders:   heatColor(sum("front_delts","side_delts","rear_delts"), cap),
    back:        heatColor(sum("lats","upper_back"), cap),
    lower_back:  heatColor(totals["lower_back"]||0, cap),
    biceps:      heatColor(totals["biceps"]||0, cap),
    triceps:     heatColor(totals["triceps"]||0, cap),
    abs:         heatColor(sum("abs","obliques"), cap),
    quads:       heatColor(totals["quads"]||0, cap),
    hamstrings:  heatColor(totals["hamstrings"]||0, cap),
    glutes:      heatColor(totals["glutes"]||0, cap),
    calves:      heatColor(totals["calves"]||0, cap),
  };
  const O = "var(--heat-outline)";
  return `<svg style="color:var(--paper)" viewBox="0 0 460 300" xmlns="http://www.w3.org/2000/svg">

    <circle cx="75" cy="20" r="16" fill="none" stroke="${O}" stroke-width="2"/>

    <rect x="114" y="60" width="14" height="38" rx="7" style="fill:${C.biceps}" stroke="currentColor" stroke-width="2"/>
    <rect x="18" y="100" width="12" height="34" rx="6" fill="none" stroke="${O}" stroke-width="2"/>

    <rect x="50" y="127" width="20" height="62" rx="9" style="fill:${C.quads}" stroke="currentColor" stroke-width="2"/>

    <text x="75" y="260" style="fill:var(--mute)" font-size="11" text-anchor="middle" font-family="sans-serif">FRONT</text>
  </g>
  <g transform="translate(255,5)">

const MUSCLE_SECTIONS = [
  {label:"Chest", groups:["chest","upper_chest"]},
  {label:"Back", groups:["lats","upper_back","lower_back"]},
  {label:"Shoulders", groups:["front_delts","side_delts","rear_delts"]},
  {label:"Biceps", groups:["biceps"]},
  {label:"Triceps", groups:["triceps"]},
  {label:"Core", groups:["abs","obliques"]},
  {label:"Legs", groups:["quads","hamstrings","glutes","calves","adductors"]}
];

const MUSCLE_GROUP_LABELS = {
  "upper_chest":"Upper Chest","chest":"Chest","lats":"Lats","upper_back":"Upper Back",
  "lower_back":"Lower Back","front_delts":"Front Delts","side_delts":"Side Delts",
  "rear_delts":"Rear Delts","biceps":"Biceps","triceps":"Triceps",
  "abs":"Abs","obliques":"Obliques","quads":"Quads","hamstrings":"Hamstrings",
  "glutes":"Glutes","calves":"Calves","adductors":"Adductors"
};

function muscleStatsRows(totals){
  const sections = MUSCLE_SECTIONS.map(sec=>{
    const rows = sec.groups
      .map(g=>({name:MUSCLE_GROUP_LABELS[g]||g, count:totals[g]||0}))
      .filter(r=>r.count>0)
      .sort((a,b)=>b.count-a.count);
    const total = rows.reduce((s,r)=>s+r.count,0);
    return {label:sec.label, total, rows};
  }).filter(sec=>sec.total>0)
    .sort((a,b)=>b.total-a.total);

  if(!sections.length){
    return `<div class="chart-empty">No muscle groups logged yet.</div>`;
  }

  return sections.map(sec=>{
    const rowsHtml = sec.rows.map(r=>
      `<div class="hrow"><div class="hn">${r.name}</div><div class="hv">${r.count} set${r.count!==1?"s":""}</div></div>`
    ).join("");
    return `<div class="section-label" style="margin:14px 0 6px">${sec.label} &middot; ${sec.total} set${sec.total!==1?"s":""}</div>
      <div class="hday">${rowsHtml}</div>`;
  }).join("");
}

// Reopens the session you just saved, prefilled with exactly what was
// submitted. Pops the just-created LOG entry — re-saving after edits
// writes a fresh entry rather than leaving a duplicate behind.
function resumeDataFromLogEntry(workingEx, logEntry){
  return workingEx.map((e,i)=>{
    if(e.superset){
      const entryA = logEntry.ex.find(le=>le.supersetGroup===i && le.n===e.exA.n);
      const entryB = logEntry.ex.find(le=>le.supersetGroup===i && le.n===e.exB.n);
      return {A: entryA?entryA.sets:[], B: entryB?entryB.sets:[]};
    }
    const entry = logEntry.ex.find(le=>le.n===e.n && le.supersetGroup===undefined);
    return entry ? entry.sets : [];
  });
}
function reopenJustSavedSession(){
  const ctx = _lastSessionEditContext;
  _lastSessionEditContext = null;
  if(!ctx || !LOG.length){ home(); return; }
  const logEntry = LOG.pop();
  const p = PLAN.find(x=>x.id===ctx.sessionId);
  sessionState = {
    id: ctx.sessionId,
    started: true,
    workingEx: ctx.workingEx,
    originalEx: JSON.parse(JSON.stringify(p ? p.ex : ctx.workingEx)),
    adHocName: logEntry.adHocName || null
  };
  const resumeData = resumeDataFromLogEntry(ctx.workingEx, logEntry);
  renderActiveSessionScreen(resumeData);
  startTimer(Math.round((logEntry.duration||0)*60));
}

// Six broad categories for the radar chart (Biceps/Triceps combined into
// "Arms" here specifically, unlike the more granular MUSCLE_SECTIONS used
// elsewhere - matches how most fitness apps present a distribution chart).
const RADAR_CATEGORIES = [
  {label:"Chest", groups:["chest","upper_chest"]},
  {label:"Shoulders", groups:["front_delts","side_delts","rear_delts"]},
  {label:"Arms", groups:["biceps","triceps"]},
  {label:"Legs", groups:["quads","hamstrings","glutes","calves","adductors"]},
  {label:"Core", groups:["abs","obliques"]},
  {label:"Back", groups:["lats","upper_back","lower_back"]}
];

function computeMuscleVolume(logEntries){
  const totals = {};
  MUSCLE_GROUPS.forEach(g=>totals[g]=0);
  logEntries.forEach(session=>{
    (session.ex||[]).forEach(e=>{
      const group = EXERCISE_MUSCLE_MAP[e.n];
      if(!group) return;
      (e.sets||[]).forEach(s=>{
        const w = parseFloat(s.w)||0, r = parseInt(s.r)||0;
        totals[group] += w*r;
      });
    });
  });
  return totals;
}
function radarCategoryVolumes(muscleVolumeTotals){
  return RADAR_CATEGORIES.map(cat=>cat.groups.reduce((s,g)=>s+(muscleVolumeTotals[g]||0), 0));
}

function periodLogStats(log, daysBack, offsetDays){
  offsetDays = offsetDays || 0;
  const end = new Date(Date.now() - offsetDays*86400000);
  const start = new Date(end.getTime() - daysBack*86400000);
  const inRange = log.filter(s=>{ const d = new Date(s.date); return d>=start && d<end; });
  const workouts = inRange.length;
  const duration = inRange.reduce((sum,s)=>sum+(s.duration||0),0);
  const sets = inRange.reduce((sum,s)=>sum+(s.ex||[]).reduce((s2,e)=>s2+((e.sets||[]).length),0), 0);
  const volume = inRange.reduce((sum,s)=>sum+(s.ex||[]).reduce((s2,e)=>s2+(e.sets||[]).reduce((s3,st)=>s3+(parseFloat(st.w)||0)*(parseInt(st.r)||0),0),0), 0);
  return {workouts, duration, sets, volume, log:inRange};
}

function fmtDuration(mins){
  mins = Math.round(mins);
  if(mins<60) return `${mins}m`;
  return `${Math.floor(mins/60)}h ${mins%60}m`;
}
function fmtVolume(v){
  v = Math.round(v);
  if(v>=1000) return `${(v/1000).toFixed(1)}k kg`;
  return `${v} kg`;
}
function metricDeltaHtml(cur, prev, fmt){
  const diff = cur - prev;
  if(Math.abs(diff) < 0.5) return `<span class="metric-delta flat">&#8212;</span>`;
  const cls = diff>0 ? "up" : "down";
  const arrow = diff>0 ? "&#9650;" : "&#9660;";
  return `<span class="metric-delta ${cls}">${arrow} ${fmt(Math.abs(diff))}</span>`;
}

function buildRadarChartSVG(currentVals, previousVals, labels){
  const N = labels.length;
  const W=300, H=300, cx=150, cy=150, maxR=98;
  const maxVal = Math.max(...currentVals, ...previousVals, 1);
  const angleFor = i => -Math.PI/2 + i*(2*Math.PI/N);
  const pointFor = (i, val) => {
    const r = (val/maxVal)*maxR;
    const a = angleFor(i);
    return [cx + r*Math.cos(a), cy + r*Math.sin(a)];
  };
  const rings = [0.25,0.5,0.75,1].map(frac=>{
    const pts = labels.map((_,i)=>{
      const a = angleFor(i), r = frac*maxR;
      return `${(cx+r*Math.cos(a)).toFixed(1)},${(cy+r*Math.sin(a)).toFixed(1)}`;
    }).join(" ");
    return `<polygon points="${pts}" fill="none" stroke="var(--line)" stroke-width="1"/>`;
  }).join("");
  const spokes = labels.map((_,i)=>{
    const a = angleFor(i);
    const x2 = cx+maxR*Math.cos(a), y2 = cy+maxR*Math.sin(a);
    return `<line x1="${cx}" y1="${cy}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`;
  }).join("");
  const labelPts = labels.map((lab,i)=>{
    const a = angleFor(i), lr = maxR + 20;
    const x = cx+lr*Math.cos(a), y = cy+lr*Math.sin(a);
    return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" fill="var(--mute)" font-size="12" text-anchor="middle" dominant-baseline="middle">${lab}</text>`;
  }).join("");
  const prevPts = previousVals.map((v,i)=>pointFor(i,v).map(n=>n.toFixed(1)).join(",")).join(" ");
  const currPts = currentVals.map((v,i)=>pointFor(i,v).map(n=>n.toFixed(1)).join(",")).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    ${rings}${spokes}
    <polygon points="${prevPts}" fill="var(--mute)" opacity="0.15" stroke="var(--mute)" stroke-width="1.5" stroke-dasharray="4,3"/>
    <polygon points="${currPts}" fill="var(--accent)" opacity="0.25" stroke="var(--accent)" stroke-width="2"/>
    ${labelPts}
  </svg>`;
}

let exerciseMetricsTargetId = null;
let exerciseMetricsIsSelf = true;
let exerciseMetricsLog = [];
let exerciseMetricsName = null;
let exerciseMetricsPeriod = 7;

function getLoggedExerciseNames(log){
  const set = new Set();
  log.forEach(s=>(s.ex||[]).forEach(e=>{ if(e.sets && e.sets.length) set.add(e.n); }));
  return [...set].sort();
}

function computeExercisePoints(log, name){
  const points = [];
  log.forEach(s=>{
    const e = (s.ex||[]).find(x=>x.n===name);
    if(!e || !e.sets || !e.sets.length) return;
    let topWeight = null, repsAtTop = 0, volume = 0;
    e.sets.forEach(st=>{
      const w = parseFloat(st.w)||0, r = parseInt(st.r)||0;
      volume += w*r;
      if(topWeight===null || w>topWeight){ topWeight = w; repsAtTop = r; }
    });
    points.push({date:s.date, weight:topWeight||0, reps:repsAtTop, volume});
  });
  return points.sort((a,b)=>a.date.localeCompare(b.date));
}

async function openExercisePicker(personId){
  exerciseMetricsTargetId = personId || CURRENT_PROFILE.id;
  exerciseMetricsIsSelf = exerciseMetricsTargetId === CURRENT_PROFILE.id;
  app.innerHTML = `<div class="loading">Loading exercises&hellip;</div>`;
  window.scrollTo(0,0);
  if(exerciseMetricsIsSelf){

  } else {

      exerciseMetricsLog = snap.exists() ? (snap.data().log || []) : [];
    }catch(e){ exerciseMetricsLog = []; }
  }
  renderExercisePicker();
}

function totalSetsForExercise(log, name){
  let total = 0;
  log.forEach(s=>{
    const e = (s.ex||[]).find(x=>x.n===name);
    if(e && e.sets) total += e.sets.length;
  });
  return total;
}

function groupExercisesBySection(log, names){
  const groupToSection = {};
  MUSCLE_SECTIONS.forEach(sec=>sec.groups.forEach(g=>{ groupToSection[g] = sec.label; }));

  const buckets = {};
  names.forEach(n=>{
    const muscleGroup = EXERCISE_MUSCLE_MAP[n];
    const sectionLabel = groupToSection[muscleGroup] || "Other";
    if(!buckets[sectionLabel]) buckets[sectionLabel] = [];
    buckets[sectionLabel].push({name:n, sets:totalSetsForExercise(log, n)});
  });

  const sections = Object.keys(buckets).map(label=>{
    const items = buckets[label].sort((a,b)=>b.sets-a.sets);
    const total = items.reduce((s,i)=>s+i.sets, 0);
    return {label, total, items};
  });
  sections.sort((a,b)=>b.total-a.total);
  return sections;
}

function renderExercisePicker(){
  const names = getLoggedExerciseNames(exerciseMetricsLog);
  const person = exerciseMetricsIsSelf ? CURRENT_PROFILE : (PEOPLE.find(p=>p.id===exerciseMetricsTargetId) || {id:exerciseMetricsTargetId, name:exerciseMetricsTargetId});
  const backOnclick = exerciseMetricsIsSelf ? "home()" : `showClientDetail('${exerciseMetricsTargetId}')`;

  const sections = groupExercisesBySection(exerciseMetricsLog, names);
  const rows = sections.map(sec=>{
    const itemRows = sec.items.map(it=>`
      <div class="sess-row exrow" onclick="openExerciseMetrics(${jsArg(it.name)})">
        <div class="sr-info"><b>${esc(it.name)}</b><span>${it.sets} set${it.sets!==1?"s":""} logged</span></div>
        <div style="color:var(--mute);font-size:18px">&rsaquo;</div>
      </div>`).join("");
    return `<div class="section-label" style="margin:14px 0 6px">${sec.label}</div>${itemRows}`;
  }).join("");

  app.innerHTML = `
    ${topbar({back:backOnclick, title:`Exercise Metrics`, sub:esc(person.name)})}
    ${rows || '<div class="chart-empty">No exercises logged yet &mdash; complete a session first.</div>'}
  `;
  window.scrollTo(0,0);
}

  exerciseMetricsName = name;
  exerciseMetricsPeriod = 7;
  renderExerciseMetrics();
}
function setExerciseMetricsPeriod(period){
  exerciseMetricsPeriod = period;
  renderExerciseMetrics();
}

function renderExerciseMetrics(){
  const allPoints = computeExercisePoints(exerciseMetricsLog, exerciseMetricsName);
  const cutoff = new Date(Date.now() - exerciseMetricsPeriod*86400000).toISOString();
  const points = allPoints.filter(p=>p.date>=cutoff);
  const last = points[points.length-1];

  // All-time PR is deliberately computed from the FULL history (allPoints),
  // not the period-filtered points, since it shouldn't change when toggling 7/30 days.
  let pr = null;
  allPoints.forEach(p=>{
    if(!pr || p.weight>pr.weight || (p.weight===pr.weight && p.reps>pr.reps)){
      pr = {weight:p.weight, reps:p.reps, date:p.date};
    }
  });
  const prHtml = pr ? `<div class="streak-hero">
      <div class="num">${pr.weight}kg &times; ${pr.reps}</div>
      <div class="lbl">All-time PR &middot; ${fmtDate(pr.date)}</div>
    </div>` : "";

  const weightChart = buildTrendChartSVG(points.map(p=>({date:p.date, value:p.weight})));
  const repsChart = buildTrendChartSVG(points.map(p=>({date:p.date, value:p.reps})));
  const volumeChart = buildTrendChartSVG(points.map(p=>({date:p.date, value:p.volume})));

  const periodToggle = `<div class="seg">
    <button class="${exerciseMetricsPeriod===7?"active":""}" onclick="setExerciseMetricsPeriod(7)">7 days</button>
    <button class="${exerciseMetricsPeriod===30?"active":""}" onclick="setExerciseMetricsPeriod(30)">30 days</button>
  </div>`;

  app.innerHTML = `
    ${topbar({back:`renderExercisePicker()`, title:esc(exerciseMetricsName), sub:`${points.length} session${points.length!==1?"s":""} in range`})}
    ${prHtml}
    ${periodToggle}
    <div class="stat-row">
      <div class="stat-card"><div class="label">Top weight</div><div class="value">${last?last.weight+"kg":"&mdash;"}</div></div>
      <div class="stat-card"><div class="label">Reps at top</div><div class="value">${last?last.reps:"&mdash;"}</div></div>
      <div class="stat-card"><div class="label">Volume</div><div class="value">${last?last.volume:"&mdash;"}</div></div>
    </div>

    <div class="section-label">Weight &mdash; top set, last ${exerciseMetricsPeriod} days</div>
    <div class="chart-card">${weightChart}</div>

    <div class="section-label">Reps &mdash; at top weight, last ${exerciseMetricsPeriod} days</div>
    <div class="chart-card">${repsChart}</div>

    <div class="section-label">Total volume &mdash; last ${exerciseMetricsPeriod} days</div>
    <div class="chart-card">${volumeChart}</div>
    <div class="last-updated">Volume = weight &times; reps, summed across every set that exercise that session.</div>
  `;
  window.scrollTo(0,0);
}

// ── Update checker ──────────────────────────────────────────
// Fetches the live page with cache bypassed and compares its APP_VERSION to
// the one currently running. If they differ, a new release has gone out
// since this copy was loaded — show a small banner to refresh. This matters
// most for a home-screen icon, which can otherwise keep opening a cached
// copy indefinitely rather than fetching the latest release.
let _updateBannerShown = false;
let _lastUpdateCheckAt = 0;
// Service worker: keeps a copy of the app on the phone so it opens with no
// signal at all (see sw.js). Failing to register just means no offline launch.
if("serviceWorker" in navigator){
  // Ask for the latest sw.js on every open, so a change to what's stored on
  // the phone (e.g. new images) lands straight away rather than whenever the
  // browser next decides to check.
  navigator.serviceWorker.register("./sw.js").then(reg=>reg.update()).catch(()=>{});
}

async function checkForAppUpdate(){
  if(_updateBannerShown) return;
  const now = Date.now();
  if(now - _lastUpdateCheckAt < 10000) return; // avoid duplicate checks firing within 10s of each other
  _lastUpdateCheckAt = now;
  try{
    const res = await fetch(location.pathname + "?_v=" + Date.now(), {cache:"no-store"});
    if(!res.ok) return;
    const text = await res.text();
    const match = text.match(/const APP_VERSION\s*=\s*"([^"]+)"/);
    if(match && match[1] && match[1] !== APP_VERSION){
      showUpdateBanner();
    }
  }catch(e){ /* offline or blocked - silently skip, will retry next check */ }
}
function showUpdateBanner(){
  if(_updateBannerShown) return;
  _updateBannerShown = true;
  const banner = document.createElement("div");
  banner.className = "app-update-banner";
  banner.innerHTML = `<span>&#128260; A new version is available</span><button onclick="location.href=location.pathname+'?_v='+Date.now()">Refresh</button>`;
  document.body.appendChild(banner);
}
// Check shortly after load (let the initial boot settle first), whenever the
// app is brought back to the foreground, and every 5 minutes while it stays open.
setTimeout(checkForAppUpdate, 4000);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) checkForAppUpdate(); });
setInterval(checkForAppUpdate, 5*60*1000);
